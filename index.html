const TITULO_CAD = { usuarios: 'Usuários' };
const abasCadastro = (abas) => `<div class="aba">${abas.map((k) =>
  `<button data-aba="${k}" aria-selected="${k === S.aba}">${esc((CRUDS[k] || {}).titulo || TITULO_CAD[k] || k)}</button>`).join('')}</div>`;

function telaCadastros() {
  const quadros = DB.param('quadros') || {};
  const meus = quadros[(S.user || {}).perfil];
  const abas = Object.keys(CRUDS).concat('usuarios')
    .filter((k) => !meus || !meus.length || meus.includes(k));
  if (!abas.includes(S.aba)) S.aba = abas[0] || 'canais';
  if (S.aba === 'usuarios') return telaUsuarios(abas);
  const c = CRUDS[S.aba];
  const lista = DB.get(c.col);
  return abasCadastro(abas) + `
  <div class="cartao"><div class="cab"><h2>${esc(c.titulo)}</h2><span class="nota">${lista.length} registros</span>
    <button class="btn mini" style="margin-left:auto" data-act="crud-novo" data-crud="${S.aba}">+ Novo</button></div>
    <div class="corpo rolar">${lista.length ? `<table><thead><tr>${c.cols.map((x) => `<th>${esc(x.l)}</th>`).join('')}<th></th></tr></thead>
      <tbody>${lista.map((o) => `<tr>${c.cols.map((x) => `<td>${esc(o[x.k] ?? '')}</td>`).join('')}
        <td style="text-align:right;white-space:nowrap">
          <button class="btn ghost mini" data-act="crud-editar" data-crud="${S.aba}" data-id="${o.id}">Editar</button>
          <button class="btn ghost mini" data-act="crud-excluir" data-crud="${S.aba}" data-id="${o.id}">✕</button>
        </td></tr>`).join('')}</tbody></table>` : '<div class="vazio">Nada cadastrado ainda.</div>'}</div></div>`;
}
function crudForm(chave, id) {
  const c = CRUDS[chave], o = id ? Object.assign({}, porId(c.col, id)) : {};
  modal((id ? 'Editar ' : 'Novo ') + c.titulo.replace(/s$/, '').toLowerCase(),
    c.campos.map((f) => campo(f, o[f.k])).join(''),
    [{ t: 'Cancelar', cls: 'ghost', fn: fecharModal }, {
      t: 'Salvar', fn: (f) => {
        const d = lerFormulario(f);
        if (c.campos.some((x) => x.req && !d[x.k])) { toast('Preencha os campos obrigatórios.'); return; }
        if (id) { d.id = id; DB.upd(c.col, d); } else DB.add(c.col, d);
        registrar(`${c.titulo}: ${d.nome}`); fecharModal(); toast('Salvo'); render();
      }
    }]);
}

/* ---- PERFIS DE ACESSO ---- */
function formPerfil(id) {
  const p = id ? Object.assign({}, perfilDe(id)) : { aprovar: false, excluir: false, gerencial: false };
  const sn = (v) => v ? 'sim' : 'nao';
  modal(id ? 'Editar perfil' : 'Novo perfil', `
    ${campo({ k: 'nome', l: 'Nome do perfil', req: true, ph: 'ex.: Assessoria de imprensa' }, p.nome)}
    ${campo({ k: 'gerencial', l: 'Enxerga todas as squads', t: 'select', vazio: false,
      opcoes: [{ v: 'nao', t: 'Não, só a squad da pessoa' }, { v: 'sim', t: 'Sim, a operação inteira' }],
      nota: 'quem não enxerga tudo vê apenas as ações da própria squad' }, sn(p.gerencial))}
    <div class="dupla">
      ${campo({ k: 'aprovar', l: 'Pode liberar aprovação', t: 'select', vazio: false,
        opcoes: [{ v: 'nao', t: 'Não' }, { v: 'sim', t: 'Sim' }] }, sn(p.aprovar))}
      ${campo({ k: 'excluir', l: 'Pode excluir registro', t: 'select', vazio: false,
        opcoes: [{ v: 'nao', t: 'Não' }, { v: 'sim', t: 'Sim' }] }, sn(p.excluir))}
    </div>
    ${campo({ k: 'telas', l: 'Abas que este perfil vê', t: 'checks',
      opcoes: TELAS.map((t) => ({ v: t, t: (TITULOS[t] || [t])[0] })),
      nota: 'dá para ajustar depois na matriz de permissões' }, id ? acessosDe(id) : ['painel', 'acoes', 'repercussao', 'relatorios'])}
    ${p.fixo ? '<p style="font-size:12px;color:var(--muted);margin:4px 0 0">Perfil de fábrica: dá para renomear e mexer nos poderes, mas ele não pode ser excluído.</p>' : ''}`,
    [{ t: 'Cancelar', cls: 'ghost', fn: fecharModal }, {
      t: 'Salvar', fn: (f) => {
        const d = lerFormulario(f);
        if (!d.nome) { toast('Dê um nome ao perfil.'); return; }
        const reg = {
          nome: d.nome.trim(),
          aprovar: d.aprovar === 'sim', excluir: d.excluir === 'sim', gerencial: d.gerencial === 'sim'
        };
        const telas = (d.telas || []).filter((t) => TELAS.includes(t));
        /* quem libera aprovação precisa da aba para chegar na fila */
        if (reg.aprovar && !telas.includes('aprovacoes')) telas.push('aprovacoes');
        if (id) {
          const salvo = (DB.get('perfis') || []).find((x) => x.id === id);
          if (salvo) DB.upd('perfis', Object.assign(salvo, reg));
          else DB.add('perfis', Object.assign(reg, { id }));
          reg.id = id;
        } else {
          /* id curto e estável, a partir do nome */
          let base = reg.nome.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
            .replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 18) || 'perfil';
          let novo = base, n = 2;
          while (perfis().some((x) => x.id === novo)) novo = base + n++;
          DB.add('perfis', Object.assign(reg, { id: novo }));
          reg.id = novo;
        }
        const m = Object.assign({}, DB.param('acessos') || {});
        m[reg.id] = telas;
        DB.param('acessos', m);
        registrar('Perfil ' + reg.nome); fecharModal(); toast('Perfil salvo'); montarShell(); render();
      }
    }]);
}

/* ---- EXPORTAÇÃO ---- */
async function baixarBinario(nome, bytes) {
  try {
    if (window.claude && typeof claude.use === 'function') {
      const d = await claude.use('downloads');
      if (d) { await d.save({ filename: nome, data: bytes }); return; }
    }
  } catch (e) {
    if (e && e.code === 'declined') { toast('Download cancelado'); return; }
  }
  const b = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
  const u = URL.createObjectURL(b);
  const a = document.createElement('a'); a.href = u; a.download = nome;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 1200);
}

async function baixar(nome, texto, tipo) {
  const conteudo = '\uFEFF' + texto;

  /* 1. quando o sistema roda dentro de um artifact do Claude, o download passa pela permissão do visualizador */
  try {
    if (window.claude && typeof claude.use === 'function') {
      const d = await claude.use('downloads');
      if (d) {
        await d.save({ filename: nome, data: conteudo });
        toast('Arquivo salvo');
        return;
      }
    }
  } catch (e) {
    if (e && e.code === 'declined') { toast('Download cancelado'); return; }
    /* qualquer outro motivo cai no plano B */
  }

  /* 2. navegador normal: download direto */
  let tentou = false;
  try {
    const b = new Blob([conteudo], { type: (tipo || 'text/csv') + ';charset=utf-8' });
    const u = URL.createObjectURL(b);
    const a = document.createElement('a'); a.href = u; a.download = nome;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 900);
    tentou = true;
  } catch (e) { }

  /* 3. plano B: mostra o conteúdo para copiar */
  modal('Arquivo: ' + nome, `<p style="margin-top:0;color:var(--muted);font-size:13px">${tentou ? 'Se o download não abrir sozinho' : 'O download está bloqueado neste ambiente'}, copie o conteúdo abaixo e cole num arquivo <b>${esc(nome)}</b>.</p>
    <textarea id="saida" style="width:100%;height:240px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface-2)">${esc(texto)}</textarea>`,
    [{ t: 'Copiar', cls: 'ghost', fn: () => { const t = $('#saida'); t.select(); try { document.execCommand('copy'); toast('Copiado'); } catch (e) { toast('Selecione e copie'); } } },
    { t: 'Fechar', fn: fecharModal }]);
}
function csvDeAcoes() {
  const A = periodo(minhasAcoes(DB.get('acoes')));
  const cab = ['Título', 'Frente', 'Squad', 'Responsável', 'Está com quem', 'Vínculo', 'Tipo', 'Marca', 'Município', 'Canais', 'Status', 'Checklist', 'Liberada por', 'Conta na meta', 'Criada em', 'Prazo', 'Em produção em', 'Concluída em', 'Situação', 'Link'];
  const linhas = A.map((a) => {
    const an = porId('analistas', a.analistaId) || {};
    return [a.titulo, a.frente || '', nomeDe('squads', a.squadId), an.nome || '', a.comQuem || '',
      an.vinculo === 'icone' ? 'Ícone' : 'Aegea',
      nomeDe('tipos', a.tipoId), nomeDe('marcas', a.marcaId), a.municipio || '',
      (a.canais || []).map((c) => nomeDe('canais', c)).join(' + '),
      (STATUS.find((s) => s.id === a.status) || {}).nome || a.status,
      checklistDe(a).ok ? 'OK' : 'Falta ' + checklistDe(a).falta.join(', '),
      a.aprovadoPor || '', conta(a) ? 'Sim' : 'Não',
      fmtData(a.criadoEm), fmtData(a.prazo), fmtData(a.producaoEm), fmtData(a.concluidoEm),
      saudeDe(a).t, a.linkDrive || ''];
  });
  return [cab, ...linhas].map((l) => l.map((c) => `"${String(c ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
}

/* cor de cada regional no mapa da capa geral */
const CORES_REG = {
  'Litoral': '17E3CB', 'Meio Norte': 'FFFFFF', 'Cerrado': 'E9A73C',
  'Semiárido - Norte': 'C6D0F7', 'Semiárido - Sul': '8FA3BC',
  'Teresina': '5D77E3', 'Timon': '3C4F96'
};

function ppDadosDoDia(squadId, de, ate) {
  const dentro = (d) => d && d >= de && d <= ate;
  const acoes = DB.get('acoes')
    .filter((a) => !squadId || a.squadId === squadId)
    .filter((a) => dentro(a.criadoEm) || dentro(a.concluidoEm))
    .sort((a, b) => (a.frente || 'zzz').localeCompare(b.frente || 'zzz', 'pt-BR') ||
      (a.criadoEm || '').localeCompare(b.criadoEm || ''));
  const reps = DB.get('repercussoes')
    .filter((r) => !squadId || r.squadId === squadId)
    .filter((r) => dentro(r.data))
    .sort((a, b) => (a.data || '').localeCompare(b.data || ''));
  return { acoes, reps };
}

function ppCorSituacao(status) {
  const C = PPTX.cores;
  if (status === 'concluido') return { cor: C.VERDE, fundo: C.VERDE_F };
  if (status === 'standby') return { cor: C.CINZA, fundo: C.ZEBRA };
  if (status === 'producao') return { cor: '1B4F8C', fundo: 'E8ECFB' };
  return { cor: C.AMBAR, fundo: C.AMBAR_F };
}

const ppDiaMes = (iso) => iso ? iso.slice(8, 10) + '.' + iso.slice(5, 7) : '';
const ppPorExtenso = (iso) => {
  const m = ['JANEIRO', 'FEVEREIRO', 'MARÇO', 'ABRIL', 'MAIO', 'JUNHO', 'JULHO',
    'AGOSTO', 'SETEMBRO', 'OUTUBRO', 'NOVEMBRO', 'DEZEMBRO'];
  if (!iso) return '';
  return Number(iso.slice(8, 10)) + ' DE ' + m[Number(iso.slice(5, 7)) - 1] + ' DE ' + iso.slice(0, 4);
};

/* ---------- mapa em PNG ---------- */
function ppMapaPNG(pintar, alturaPx) {
  return new Promise((ok) => {
    try {
      const vb = (ASSETS.mapa.viewBox || '0 0 1000 1456').split(' ').map(Number);
      const h = alturaPx || 1000, w = Math.round((vb[2] / vb[3]) * h);
      const paths = Object.entries(ASSETS.mapa.regioes).map(([k, d]) => {
        const c = pintar(k);
        return '<path d="' + d + '" fill="' + c.fill + '" fill-opacity="' + (c.op === undefined ? 1 : c.op) +
          '" stroke="' + (c.linha || '#0027BD') + '" stroke-width="5" stroke-linejoin="round"/>';
      }).join('');
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + ASSETS.mapa.viewBox +
        '" width="' + w + '" height="' + h + '">' + paths + '</svg>';
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        ok({ dados: c.toDataURL('image/png'), prop: w / h });
      };
      img.onerror = () => ok(null);
      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
    } catch (e) { ok(null); }
  });
}

/* ---------- capa de uma regional ---------- */
async function ppCapaRegional(dataTxt, squad, frentes, conteudos) {

    ? { fill: '#17E3CB', linha: '#17E3CB' }

  if (mapa) {
    const mh = 5.2, mw = mh * mapa.prop;
    f.push(PPTX.imagem(id++, rid(mapa.dados), { x: L - 1.2 - mw, y: 0.42, w: mw, h: mh }));
  }

  f.push(PPTX.retangulo(id++, { x: 0.78, y: 0.88, w: 0.055, h: 1.66, cor: C.TURQ }));

  const gente = DB.get('analistas').filter((a) => a.ativo && a.squadId === squad.id).slice(0, 4);
  if (gente.length) {

/* ---------- páginas de tabela ---------- */
function ppPaginasTabela(titulo, cabecalhos, larguras, linhas, nota, porPagina) {
  const slides = [], max = porPagina || 11;
  const blocos = [];
  for (let i = 0; i < linhas.length; i += max) blocos.push(linhas.slice(i, i + max));
  if (!blocos.length) blocos.push([]);
  blocos.forEach((bloco, bi) => {
    const f = []; let id = 2;
    const imagens = [];
    const rid = (d) => { imagens.push(d); return 'rId' + (imagens.length + 1); };
    id = ppCabecalho(f, id, titulo + (blocos.length > 1 ? '  (' + (bi + 1) + '/' + blocos.length + ')' : ''), rid);
    if (bloco.length) {
      f.push(PPTX.tabela(id++, { x: 0.42, y: 1.16, larguras, linhas: [cabecalhos].concat(bloco), altura: 0.38 }));
    } else {
      f.push(PPTX.caixa(id++, 'Nada registrado neste período.', { x: 0.42, y: 1.6, w: 9, h: 0.4, tam: 13, cor: PPTX.cores.CINZA }));
    }
    id = ppRodape(f, id, nota);
    slides.push({ xml: PPTX.slide(f), imagens });
  });
  return slides;
}

/* ---------- monta o arquivo ---------- */
async function ppMontarQuadro(squadId) {
  const de = S.filtros.de, ate = S.filtros.ate;
  const C = PPTX.cores;
  const umDia = de === ate;
  const largo = difDias(de, ate) > 400;
  const dataTxt = largo ? 'TUDO O QUE ESTÁ CADASTRADO'
    : umDia ? ppPorExtenso(de) : fmtData(de) + ' A ' + fmtData(ate);
  const nota = largo ? 'tudo o que está cadastrado' : umDia ? fmtData(de) : fmtData(de) + ' a ' + fmtData(ate);

  const todas = DB.get('squads');
  const squads = todas.filter((q) => !squadId || q.id === squadId);
  const nomeTopo = squadId ? (nomeDe('squads', squadId) || 'Regional').toUpperCase() : 'GUERRILHA DE COMUNICAÇÃO';

  const { acoes, reps } = ppDadosDoDia(squadId, de, ate);
  const slides = [];

  if (squadId) {
    const q = porId('squads', squadId);
    slides.push(await ppCapaRegional(dataTxt, q,
      new Set(acoes.map((a) => a.frente).filter(Boolean)).size, acoes.length));
  } else {
    slides.push(await ppCapaGeral(dataTxt, todas, acoes.length));
  }

  for (const q of squads) {
    const daSquad = acoes.filter((a) => a.squadId === q.id);
    if (!daSquad.length && squads.length > 1) continue;

    if (!squadId) {
      slides.push(await ppCapaRegional(dataTxt, q,
        new Set(daSquad.map((a) => a.frente).filter(Boolean)).size, daSquad.length));
    }

    const linhas = daSquad.map((a, i) => {
      const cs = ppCorSituacao(a.status);
      const an = porId('analistas', a.analistaId);
      const st = (STATUS.find((x) => x.id === a.status) || {}).nome || a.status;
      const canais = (a.canais || []).map((c) => nomeDe('canais', c)).filter(Boolean).join(', ');
      return [
        { t: String(i + 1).padStart(2, '0'), alin: 'ctr', cor: C.AZUL, neg: true },
        { t: ppDiaMes(a.criadoEm), alin: 'ctr', cor: C.AZUL, neg: true },
        { t: a.frente || '—' },
        { t: a.titulo || '—', neg: true },
        { t: a.municipio || '—', cor: C.CINZA },
        { t: canais || '—', cor: C.CINZA },
        { t: a.comQuem || (an ? an.nome : '—'), cor: C.CINZA },
        { t: st, neg: true, cor: cs.cor, fundo: cs.fundo }
      ];
    });
    ppPaginasTabela(q.nome.toUpperCase() + '  |  QUADRO DO DIA',
      ['#', 'DATA', 'PAUTA', 'CONTEÚDO', 'MUNICÍPIO', 'CANAL', 'RESPONSÁVEL', 'SITUAÇÃO'],
      [0.45, 0.72, 3.15, 1.85, 1.75, 1.35, 1.75, 1.45], linhas, nota
    ).forEach((sl) => slides.push(sl));

    const daRep = reps.filter((r) => r.squadId === q.id);
    if (daRep.length) {
      const lr = daRep.map((r, i) => {
        const tom = TONS.find((t) => t.id === r.tom) || TONS[1];
        const corTom = r.tom === 'positivo' ? C.VERDE : r.tom === 'negativo' ? 'BE0F4B' : C.INK;
        return [
          { t: String(i + 1).padStart(2, '0'), alin: 'ctr', cor: C.AZUL, neg: true },
          { t: ppDiaMes(r.data), alin: 'ctr', cor: C.AZUL, neg: true },
          { t: r.titulo || '—', neg: true },
          { t: nomeDe('veiculos', r.veiculoId) || '—', cor: C.CINZA },
          { t: (TIPOS_REP.find((x) => x.v === r.tipo) || {}).t || r.tipo || '—', cor: C.CINZA },
          { t: num(r.alcance || 0), alin: 'r' },
          { t: num(r.interacoes || 0), alin: 'r' },
          { t: tom.nome, neg: true, cor: corTom }
        ];
      });
      ppPaginasTabela(q.nome.toUpperCase() + '  |  REPERCUSSÃO',
        ['#', 'DATA', 'REPERCUSSÃO', 'VEÍCULO', 'TIPO', 'ALCANCE', 'INTERAÇÕES', 'TOM'],
        [0.45, 0.72, 3.5, 2.0, 2.05, 1.2, 1.35, 1.2], lr, nota
      ).forEach((sl) => slides.push(sl));
    }
  }

  return { dados: PPTX.montar(slides, 'Guerrilheiros · ' + nomeTopo + ' · ' + nota), nome: nomeTopo };
}

async function ppBaixar(squadId) {
  try {
    toast('Montando o PowerPoint...');
    const r = await ppMontarQuadro(squadId);
    const limpo = r.nome.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const arquivo = 'quadro-do-dia-' + limpo + '-' + S.filtros.de + '.pptx';
    await baixarBinario(arquivo, r.dados);
    toast('Pronto: ' + arquivo);
  } catch (e) {
    console.error(e);
    toast('Não consegui montar o PowerPoint.');
  }
}

async function ppBaixarTodas() {
  const squads = DB.get('squads').filter((q) => pode('gerencial') || squadsDoUsuario(S.user).includes(q.id));
  let saiu = 0;
  for (const q of squads) {
    const d = ppDadosDoDia(q.id, S.filtros.de, S.filtros.ate);
    if (!d.acoes.length) continue;
    await ppBaixar(q.id);
    saiu++;
    await new Promise((r) => setTimeout(r, 800));
  }
  toast(saiu ? saiu + (saiu === 1 ? ' arquivo gerado' : ' arquivos gerados') : 'Nenhuma regional tem conteúdo no período.');
}

/* ---------- abrir o ZIP do pptx ---------- */
async function zipLer(buffer) {
  const dv = new DataView(buffer), u8 = new Uint8Array(buffer);
  let fim = -1;
  for (let i = buffer.byteLength - 22; i >= 0 && i > buffer.byteLength - 66000; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { fim = i; break; }
  }
  if (fim < 0) throw new Error('Isso não parece um arquivo do PowerPoint.');
  const qtd = dv.getUint16(fim + 10, true);
  let p = dv.getUint32(fim + 16, true);
  const arquivos = {};
  for (let i = 0; i < qtd; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const metodo = dv.getUint16(p + 10, true);
    const comp = dv.getUint32(p + 20, true);
    const tamNome = dv.getUint16(p + 28, true);
    const tamExtra = dv.getUint16(p + 30, true);
    const tamCom = dv.getUint16(p + 32, true);
    const local = dv.getUint32(p + 42, true);
    const nome = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + tamNome));
    const lnNome = dv.getUint16(local + 26, true), lnExtra = dv.getUint16(local + 28, true);
    const ini = local + 30 + lnNome + lnExtra;
    arquivos[nome] = { metodo, dados: u8.subarray(ini, ini + comp) };
    p += 46 + tamNome + tamExtra + tamCom;
  }
  return arquivos;
}

async function zipTexto(entrada) {
  if (!entrada) return '';
  if (entrada.metodo === 0) return new TextDecoder().decode(entrada.dados);
  if (typeof DecompressionStream === 'undefined') {
    throw new Error('Este navegador não consegue abrir o arquivo. Use Chrome ou Edge atualizado.');
  }
  const fluxo = new Blob([entrada.dados]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new TextDecoder().decode(await new Response(fluxo).arrayBuffer());
}

/* ---------- ajuda de texto ---------- */
const semAcento = (s) => String(s || '').toLowerCase().normalize('NFD')
  .replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();

const COLUNAS = {
  frente: ['pauta', 'frente', 'assunto', 'projeto', 'acao'],
  titulo: ['conteudo', 'titulo', 'material', 'entrega', 'peca'],
  municipio: ['municipio', 'cidade', 'local'],
  canal: ['canal', 'canais', 'onde saiu'],
  responsavel: ['responsavel', 'analista', 'quem faz', 'quem fez'],
  comQuem: ['esta com quem', 'com quem', 'esta com'],
  status: ['situacao', 'status'],
  data: ['data', 'dia'],
  obs: ['observacao', 'obs', 'nota', 'observacoes']
};

const STATUS_TEXTO = {
  planejado: 'criacao', criacao: 'criacao', ideia: 'criacao', 'a fazer': 'criacao', previsto: 'criacao',
  'em producao': 'producao', producao: 'producao', produzindo: 'producao', 'em andamento': 'producao',
  gravado: 'producao', gravados: 'producao', 'ja gravados': 'producao', 'ja gravado': 'producao',
  'em aprovacao': 'aprovacao', aprovacao: 'aprovacao', aguardando: 'aprovacao', pronto: 'aprovacao',
  'pronto para sair': 'aprovacao', 'ja solicitado': 'aprovacao',
  concluido: 'concluido', concluida: 'concluido', ok: 'concluido', publicado: 'concluido',
  feito: 'concluido', entregue: 'concluido', veiculado: 'concluido',
  'stand-by': 'standby', standby: 'standby', parado: 'standby', pausado: 'standby', suspenso: 'standby'
};

function impStatus(txt) {
  const t = semAcento(txt);
  if (!t) return 'criacao';
  if (STATUS_TEXTO[t]) return STATUS_TEXTO[t];
  const achou = Object.keys(STATUS_TEXTO).find((k) => t.includes(k));
  return achou ? STATUS_TEXTO[achou] : 'criacao';
}

function impData(txt, ano) {
  const t = String(txt || '').trim();
  let m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = t.match(/^(\d{1,2})[./-](\d{1,2})(?:[./-](\d{2,4}))?/);
  if (m) {
    const d = m[1].padStart(2, '0'), mes = m[2].padStart(2, '0');
    let a = m[3] || ano || String(new Date().getFullYear());
    if (a.length === 2) a = '20' + a;
    return `${a}-${mes}-${d}`;
  }
  return '';
}

function impAcharSquad(texto) {
  const t = semAcento(texto);
  const q = DB.get('squads').find((s) => t.includes(semAcento(s.nome)));
  return q ? q.id : '';
}
function impAcharAnalista(nome) {
  const t = semAcento(nome);
  if (!t) return null;
  const lista = DB.get('analistas');
  return lista.find((a) => semAcento(a.nome) === t)
    || lista.find((a) => semAcento(a.nome).includes(t) || t.includes(semAcento(a.nome)))
    || null;
}
function impAcharTipo(titulo) {
  const t = semAcento(titulo);
  const tipos = DB.get('tipos');
  return (tipos.find((x) => t.includes(semAcento(x.nome).split(' ')[0])) || {}).id || '';
}

/* ---------- ler as tabelas de um slide ---------- */
function impSlide(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const texto = (no) => Array.from(no.getElementsByTagName('a:t')).map((t) => t.textContent).join(' ').trim();

  const titulos = Array.from(doc.getElementsByTagName('p:sp')).map(texto).filter(Boolean);
  const tabelas = Array.from(doc.getElementsByTagName('a:tbl')).map((tbl) =>
    Array.from(tbl.getElementsByTagName('a:tr')).map((tr) =>
      Array.from(tr.getElementsByTagName('a:tc')).map(texto)));
  return { titulos, tabelas };
}

/* ---------- transformar em ações ---------- */
function impLerArquivo(slides) {
  const anoTodo = (() => {
    const t = slides.map((s) => s.titulos.join(' ')).join(' ').match(/\b(20\d{2})\b/);
    return t ? t[1] : String(new Date().getFullYear());
  })();

  const linhas = [];
  let squadAtual = '';
  slides.forEach((s) => {
    const cabec = s.titulos.join(' | ');
    const achou = impAcharSquad(cabec);
    if (achou) squadAtual = achou;

    s.tabelas.forEach((tab) => {
      if (tab.length < 2) return;
      const cab = tab[0].map(semAcento);
      const idx = {};
      Object.keys(COLUNAS).forEach((k) => {
        const i = cab.findIndex((c) => COLUNAS[k].some((nome) => c === nome || c.includes(nome)));
        if (i >= 0) idx[k] = i;
      });
      if (idx.titulo === undefined && idx.frente === undefined) return;   /* não é tabela de conteúdo */

      tab.slice(1).forEach((linha) => {
        const pega = (k) => (idx[k] === undefined ? '' : (linha[idx[k]] || '').trim());
        const titulo = pega('titulo') || pega('frente');
        if (!titulo || semAcento(titulo) === 'total') return;
        linhas.push({
          squadId: squadAtual,
          frente: pega('frente'),
          titulo,
          municipio: pega('municipio'),
          canal: pega('canal'),
          responsavel: pega('responsavel'),
          comQuem: pega('comQuem') || pega('responsavel'),
          status: impStatus(pega('status')),
          data: impData(pega('data'), anoTodo) || hoje(),
          obs: pega('obs')
        });
      });
    });
  });
  return linhas;
}

/* ---------- gravar ---------- */
function impGravar(linhas) {
  const acoes = DB.get('acoes');
  let novas = 0, atualizadas = 0, puladas = 0;

  linhas.forEach((l) => {
    if (!l.squadId) { puladas++; return; }
    const an = impAcharAnalista(l.responsavel);
    let canalId = '';
    if (l.canal) {
      const c = DB.get('canais').find((x) => semAcento(x.nome) === semAcento(l.canal));
      canalId = c ? c.id : DB.add('canais', { nome: l.canal.trim(), tipo: 'Importado' }).id;
    }
    const igual = acoes.find((a) => a.squadId === l.squadId && a.criadoEm === l.data &&
      semAcento(a.titulo) === semAcento(l.titulo) && semAcento(a.frente || '') === semAcento(l.frente || ''));

    const dados = {
      titulo: l.titulo, frente: l.frente, squadId: l.squadId,
      analistaId: an ? an.id : (igual ? igual.analistaId : ''),
      comQuem: l.comQuem, municipio: l.municipio,
      tipoId: (igual && igual.tipoId) || impAcharTipo(l.titulo),
      canais: canalId ? [canalId] : (igual ? igual.canais : []),
      status: l.status, criadoEm: l.data,
      obs: l.obs || (igual ? igual.obs : '')
    };
    if (l.status === 'concluido') dados.concluidoEm = (igual && igual.concluidoEm) || l.data;
    if (l.status !== 'criacao') dados.producaoEm = (igual && igual.producaoEm) || l.data;

    if (igual) {
      if (igual.status !== l.status || igual.comQuem !== l.comQuem || igual.municipio !== l.municipio) {
        DB.upd('acoes', Object.assign({ id: igual.id }, dados));
        atualizadas++;
      } else puladas++;
    } else {
      DB.add('acoes', Object.assign({
        marcaId: (DB.get('marcas')[0] || {}).id || '', fornecedorId: '', prioridade: 'media',
        prazo: '', aprovado: false, aprovadoPor: '', aprovadoEm: '', motivo: '',
        tamanhoMB: '', linkDrive: '', criadoPor: S.user.login, importado: 1
      }, dados));
      novas++;
    }
  });

  registrar(`Quadro do dia importado: ${novas} novas, ${atualizadas} atualizadas`);
  return { novas, atualizadas, puladas };
}

/* ---------- tela ---------- */
function impAbrir() {
  const ent = document.createElement('input');
  ent.type = 'file'; ent.accept = '.pptx';
  ent.addEventListener('change', async () => {
    const arq = ent.files && ent.files[0];
    if (!arq) return;
    try {
      toast('Lendo ' + arq.name + '...');
      const zip = await zipLer(await arq.arrayBuffer());
      const nomes = Object.keys(zip).filter((n) => /^ppt\/slides\/slide\d+\.xml$/.test(n))
        .sort((a, b) => (+a.match(/(\d+)/)[1]) - (+b.match(/(\d+)/)[1]));
      if (!nomes.length) throw new Error('Não achei slides nesse arquivo.');
      const slides = [];
      for (const n of nomes) slides.push(impSlide(await zipTexto(zip[n])));
      const linhas = impLerArquivo(slides);
      if (!linhas.length) {
        modal('Nada para importar', `<p style="margin-top:0">Não achei nenhuma tabela de conteúdos nesse arquivo.</p>
          <p style="font-size:13px;color:var(--muted)">A tabela precisa ter uma linha de cabeçalho com pelo menos <b>Conteúdo</b> ou <b>Pauta</b>. O sistema também entende Frente, Município, Canal, Responsável, Está com quem, Situação e Data.</p>`,
          [{ t: 'Fechar', fn: fecharModal }]);
        return;
      }
      impPrevia(linhas, arq.name);
    } catch (e) {
      console.error(e);
      modal('Não consegui ler o arquivo', `<p style="margin-top:0">${esc(e.message || 'Erro ao abrir o PowerPoint.')}</p>`,
        [{ t: 'Fechar', fn: fecharModal }]);
    }
  });
  ent.click();
}

    </div>

      <tbody>${linhas.slice(0, 120).map((l) => `<tr>

        <td>${esc(l.frente || '—')}</td><td><b>${esc(l.titulo)}</b></td>
        <td>${esc(l.municipio || '—')}</td>

    </div>
    ${linhas.length > 120 ? `<p style="font-size:12px;color:var(--muted)">Mostrando as 120 primeiras de ${linhas.length}.</p>` : ''}

/* ==========================================================================
   Anexos e o resumo de aprovação.
   A coordenação vê o material na tela, sem precisar abrir link.
   ========================================================================== */
const ANEXO_MB = 20;

/* imagem e vídeo pesados ficam no IndexedDB, longe do localStorage */
const Cofre = {
  bd: null,
  abrir() {
    if (this.bd) return Promise.resolve(this.bd);
    return new Promise((ok, erro) => {
      const req = indexedDB.open(CFG.chave + '_anexos', 1);
      req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains('arq')) req.result.createObjectStore('arq'); };
      req.onsuccess = () => { this.bd = req.result; ok(this.bd); };
      req.onerror = () => erro(req.error);
    });
  },
  async op(modo, fn) {
    const bd = await this.abrir();
    return new Promise((ok, erro) => {
      const t = bd.transaction('arq', modo);
      const r = fn(t.objectStore('arq'));
      t.oncomplete = () => ok(r && r.result);
      t.onerror = () => erro(t.error);
    });
  },
  gravar(id, dados) { return this.op('readwrite', (s) => s.put(dados, id)); },
  ler(id) { return this.op('readonly', (s) => s.get(id)); },
  apagar(id) { return this.op('readwrite', (s) => s.delete(id)); }
};

const anexosDe = (acaoId) => DB.get('anexos').filter((x) => x.acaoId === acaoId);

async function anexoDados(a) {
  if (a.dados) return a.dados;
  try { return (await Cofre.ler(a.id)) || ''; } catch (e) { return ''; }
}

/* imagem grande entra reduzida; vídeo entra como veio */
function encolherImagem(arquivo) {
  return new Promise((ok) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1600;
        const e = Math.min(1, max / Math.max(img.width, img.height));
        if (e === 1 && arquivo.size < 900 * 1024) return ok(fr.result);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * e); c.height = Math.round(img.height * e);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', 0.84));
      };
      img.onerror = () => ok(fr.result);
      img.src = fr.result;
    };
    fr.onerror = () => ok('');
    fr.readAsDataURL(arquivo);
  });
}
const lerComoTexto = (arquivo) => new Promise((ok) => {
  const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = () => ok(''); fr.readAsDataURL(arquivo);
});

async function anexarNaAcao(acaoId, arquivos, aoTerminar) {
  let entraram = 0;
  for (const arq of Array.from(arquivos)) {
    const ehImg = /^image\/(png|jpe?g)$/i.test(arq.type) || /\.(png|jpe?g)$/i.test(arq.name);
    const ehPdf = /pdf$/i.test(arq.type) || /\.pdf$/i.test(arq.name);
    if (!ehImg && !ehPdf) {
      toast(/^video\//i.test(arq.type)
        ? 'Vídeo não anexa aqui. Suba no SharePoint e cole o link do material.'
        : 'Só entra JPEG, PNG ou PDF. Para vídeo, use o link do material.');
      continue;
    }
    if (arq.size > ANEXO_MB * 1024 * 1024) {
      toast(`${arq.name} tem ${(arq.size / 1048576).toFixed(0)} MB e o limite é ${ANEXO_MB} MB. Suba no SharePoint e cole o link.`);
      continue;
    }
    const dados = ehImg ? await encolherImagem(arq) : await lerComoTexto(arq);
    if (!dados) { toast('Não consegui ler ' + arq.name); continue; }
    const registro = {
      acaoId, nome: arq.name, mime: arq.type || 'application/octet-stream',
      tamanho: arq.size, criadoEm: hoje(), criadoPor: (S.user || {}).login || ''
    };
    if (REMOTO) registro.dados = dados;
    const salvo = DB.add('anexos', registro);
    if (!REMOTO) {
      try { await Cofre.gravar(salvo.id, dados); }
      catch (e) { console.warn(e); salvo.dados = dados; DB.upd('anexos', salvo); }
    }
    entraram++;
  }
  if (entraram) toast(entraram === 1 ? 'Material anexado' : entraram + ' materiais anexados');
  if (aoTerminar) aoTerminar();
}

function excluirAnexo(id) {
  DB.del('anexos', id);
  Cofre.apagar(id).catch(() => { });
}

function botaoAnexar(acaoId, depois) {
  const ent = document.createElement('input');
  ent.type = 'file'; ent.multiple = true;
  ent.accept = 'image/png,image/jpeg,image/jpg,application/pdf,.png,.jpg,.jpeg,.pdf';
  ent.addEventListener('change', () => anexarNaAcao(acaoId, ent.files, depois));
  ent.click();
}

/* ---------- pré-visualização ---------- */
async function pintarAnexos(caixa, acaoId, podeApagar) {
  const lista = anexosDe(acaoId);
  if (!lista.length) {
    caixa.innerHTML = '<div class="vazio" style="padding:18px">Nenhum material anexado. Anexe a arte ou a foto em JPEG, PNG ou PDF; vídeo entra pelo link do material.</div>';
    return;
  }
  caixa.innerHTML = '<div class="anexos"></div>';
  const grade = $('.anexos', caixa);
  for (const a of lista) {
    const d = await anexoDados(a);
    const cel = document.createElement('div');
    cel.className = 'anexo';
    const mb = (a.tamanho / 1048576).toFixed(a.tamanho > 1048576 ? 1 : 2);
    let corpo = '';
    if (/^image\//.test(a.mime) && d) corpo = `<img src="${d}" alt="${esc(a.nome)}">`;
    else if (/^video\//.test(a.mime) && d) corpo = `<video src="${d}" controls playsinline preload="metadata"></video>`;
    else if (/^audio\//.test(a.mime) && d) corpo = `<audio src="${d}" controls style="width:100%"></audio>`;
    else corpo = `<div class="arq">${/pdf/.test(a.mime) ? 'PDF' : 'arquivo'}</div>`;
    cel.innerHTML = `${corpo}
      <div class="pe"><span title="${esc(a.nome)}">${esc(a.nome)}</span>
        <span class="tam">${mb} MB</span>
        ${podeApagar ? `<button class="btn ghost mini" data-apaga="${a.id}">✕</button>` : ''}</div>`;
    cel.addEventListener('click', (e) => {
      const b = e.target.closest('[data-apaga]');
      if (b) {
        if (!podeApagar || !confirm('Tirar este material?')) return;
        excluirAnexo(b.dataset.apaga);
        pintarAnexos(caixa, acaoId, podeApagar);
        return;
      }
      if (d) abrirLupa(a, d);
    });
    grade.appendChild(cel);
  }
}

/* clique no anexo abre em tela cheia */
function abrirLupa(anexo, dados) {
  const v = document.createElement('div');
  v.className = 'lupa';
  v.innerHTML = /^image\//.test(anexo.mime)
    ? `<img src="${dados}" alt="${esc(anexo.nome)}">`
    : `<iframe src="${dados}" title="${esc(anexo.nome)}"></iframe>`;
  v.addEventListener('click', () => v.remove());
  document.addEventListener('keydown', function fecha(e) {
    if (e.key === 'Escape') { v.remove(); document.removeEventListener('keydown', fecha); }
  });
  document.body.appendChild(v);
}

      ${a.obs ? `<div style="background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-size:13px">${esc(a.obs)}</div>` : ''}
      ${a.motivo ? `<div style="background:var(--late-bg);color:var(--late);border-radius:9px;padding:10px 12px;font-size:12.5px;font-weight:600">Já foi devolvida antes: ${esc(a.motivo)}</div>` : ''}
      ${k.ok ? '' : `<div style="background:var(--warn-bg);color:var(--warn);border-radius:9px;padding:10px 12px;font-size:12.5px;font-weight:600">Falta preencher: ${esc(k.falta.join(', '))}</div>`}

      <div>
        <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px">
          <b style="font-size:13px">Material</b>
          <span style="font-size:11.5px;color:var(--muted)">JPEG, PNG ou PDF até ${ANEXO_MB} MB · vídeo vai pelo link</span>
          <button class="btn ghost mini" style="margin-left:auto" data-anexar>+ Anexar material</button>
          ${urlSegura(a.linkDrive) ? `<a class="btn ghost mini" href="${esc(urlSegura(a.linkDrive))}" target="_blank" rel="noopener noreferrer">Abrir no drive</a>` : ''}
        </div>
        <div data-galeria></div>
      </div>
    </div>`,
    [
      { t: 'Fechar', cls: 'ghost', fn: fecharModal },
      { t: 'Devolver', cls: 'perigo', fn: () => { fecharModal(); reprovar(id); } },
      { t: 'Liberar', fn: () => { fecharModal(); aprovar(id); } }
    ]);

  const gal = $('[data-galeria]', janela);
  pintarAnexos(gal, id, true);
  $('[data-anexar]', janela).addEventListener('click', () => botaoAnexar(id, () => pintarAnexos(gal, id, true)));
  if (!pode('aprovar')) {
    $$('#modal .pe .btn').forEach((b) => {
      if (b.textContent === 'Liberar' || b.textContent === 'Devolver') { b.disabled = true; b.title = 'Só a coordenação libera'; b.style.opacity = .45; }
    });
  }
}

</script>
