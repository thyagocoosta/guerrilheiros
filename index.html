<script>
/* ############################################################################
   #                                                                          #
   #   G U E R R I L H E I R O S  ·  C O N F I G U R A Ç Ã O                  #
   #                                                                          #
   #   É aqui que se mexe para subir o sistema. Nada mais neste arquivo       #
   #   precisa ser alterado.                                                  #
   #                                                                          #
   #   1. Para guardar os dados no Supabase (site na Vercel):                 #
   #        backend: 'supabase'                                               #
   #        supabase.url  = https://xxxxxxxx.supabase.co                      #
   #        supabase.anon = a chave anon do projeto                           #
   #                                                                          #
   #   2. Para rodar só no navegador, deixe backend: 'local'.                 #
   #                                                                          #

   #                                                                          #
   ############################################################################ */

  backend: 'supabase',              // 'local' (navegador) | 'supabase' (Vercel) | 'dataverse' (Power Pages)

  nome: 'GUERRILHEIROS',
  lema: 'GCA · Comunicação Aegea Piauí',
  dominio: '@aegea.com.br',
  supabase: {
    // preencha os dois e troque backend para 'supabase'. Na Vercel, dá para
    // injetar por variável de ambiente no build; a anon key é pública por desenho
    // e quem manda de verdade são as políticas de RLS da tabela.

    anon: 'sb_publishable_MAKFoU4t1aB2w_snc40vhw_LKFdGIfc',
    tabela: 'gca_registros'
  },
  dataverse: {
    // no Power Pages cada coleção vira uma tabela do Dataverse.
    // troque pelo entity set name real (plural) de cada tabela.

    canais: 'cr9d4_gcacanais', fornecedores: 'cr9d4_gcafornecedores', tipos: 'cr9d4_gcatipos',
    marcas: 'cr9d4_gcamarcas', veiculos: 'cr9d4_gcaveiculos', acoes: 'cr9d4_gcaacoes',

  }
};

/* O que for preenchido na tela Configuração -> Conexão manda em cima do que está aqui.
   Assim dá para ligar o Supabase sem abrir o arquivo. */
try {
  const _salvo = JSON.parse(localStorage.getItem('gca_conexao') || 'null');

    CFG.backend = _salvo.backend;

    CFG.supabase.anon = _salvo.anon || CFG.supabase.anon;
    CFG.supabase.tabela = _salvo.tabela || CFG.supabase.tabela;
  }
} catch (e) { }

</script>

<style>
  :root{
    --azul:#0027BD; --azul-d:#001C86; --turq:#17E3CB; --turq-ink:#00594E;
    --ink:#12263F; --ink-2:#3A4A63; --muted:#6B7C93;
    --surface:#FFFFFF; --surface-2:#F5F8FC; --ground:#EDF1F8; --line:#DCE4EE; --line-2:#C3D0E2;
    --good:#0E7C5A; --warn:#B06A00; --late:#BE0F4B;
    --good-bg:#E2F4EC; --warn-bg:#FBF0DE; --late-bg:#FCE7EE;
    --s1:#E8ECFB; --s2:#C6D0F7; --s3:#93A6EE; --s4:#5D77E3; --s5:#2E4FD6; --s6:#0027BD;
    --sombra:0 1px 2px rgba(18,38,63,.06), 0 8px 22px rgba(18,38,63,.05);
    --r:10px;
    --fonte:"Aegea Sans","AEGEA Sans","AEGEA Sans Light","AEGEA Sans ExtraLight","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --fonte-titulo:"AEGEA Sans Black","Aegea Sans","AEGEA Sans","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    color-scheme: light;   /* deixa as listas, o calendário e a barra de rolagem do navegador no claro */
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --azul:#5D77E3; --azul-d:#0A1A66; --turq:#17E3CB; --turq-ink:#8FF3E6;
      --ink:#E9EEF8; --ink-2:#C2CDE0; --muted:#8B99B3;
      --surface:#141B2E; --surface-2:#1A2338; --ground:#0D1220; --line:#27314B; --line-2:#36435F;
      --good:#3FC79A; --warn:#E0A64A; --late:#F2739A;
      --good-bg:#10312A; --warn-bg:#33270F; --late-bg:#3A1526;
      --s1:#1E2745; --s2:#2A3765; --s3:#3C4F96; --s4:#5169C9; --s5:#6D85E8; --s6:#93A6EE;
      --sombra:0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --azul:#5D77E3; --azul-d:#0A1A66; --turq:#17E3CB; --turq-ink:#8FF3E6;
    --ink:#E9EEF8; --ink-2:#C2CDE0; --muted:#8B99B3;
    --surface:#141B2E; --surface-2:#1A2338; --ground:#0D1220; --line:#27314B; --line-2:#36435F;
    --good:#3FC79A; --warn:#E0A64A; --late:#F2739A;
    --good-bg:#10312A; --warn-bg:#33270F; --late-bg:#3A1526;
    --s1:#1E2745; --s2:#2A3765; --s3:#3C4F96; --s4:#5169C9; --s5:#6D85E8; --s6:#93A6EE;
    --sombra:0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.3);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--ground);color:var(--ink);
    font-family:var(--fonte);
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{margin:0;text-wrap:balance;font-family:var(--fonte-titulo)}
  b,strong,th,.btn,.tag,.kpi .num,.kpi .rot,.nav button,.sig,.marca .sub{font-family:var(--fonte-titulo)}
  button,input,select,textarea{font-family:var(--fonte);font-size:inherit;color:inherit}
  a{color:var(--azul)}
  [hidden]{display:none!important}
  :focus-visible{outline:2px solid var(--azul);outline-offset:2px;border-radius:4px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px;border:3px solid transparent;background-clip:content-box}

  /* ---------- LOGIN ---------- */
  #login{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:
    radial-gradient(1100px 620px at 15% -10%, #1633D6 0%, transparent 60%),
    radial-gradient(900px 520px at 110% 110%, #00A996 0%, transparent 55%), #001C86;}
  .login-card{width:min(1040px,100%);display:grid;grid-template-columns:1fr 1fr;background:var(--surface);
    border-radius:18px;overflow:hidden;box-shadow:0 30px 70px rgba(0,10,60,.42)}
  .login-marca{position:relative;overflow:hidden;padding:44px 36px;display:flex;flex-direction:column;justify-content:center;gap:30px;
    background:linear-gradient(155deg,#0027BD 0%,#001C86 100%)}
  .login-marca::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(560px 340px at 115% -15%, rgba(23,227,203,.30), transparent 62%)}
  .login-marca > *{position:relative;z-index:1}
  .login-marca img{width:min(300px,94%);height:auto}
  .login-marca .bloco{border-left:4px solid var(--turq);padding-left:15px}
  .login-marca .sig{font-family:var(--fonte-titulo);font-size:27px;font-weight:800;color:#fff;line-height:1.05;letter-spacing:.02em}
  .login-marca .sub{font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--turq);font-weight:700;margin-top:7px}
  .login-marca .frase{font-size:12.5px;color:rgba(255,255,255,.82);line-height:1.5;max-width:330px}
  .login-marca .marcas-login{width:min(300px,94%);height:auto;opacity:.95;margin-top:-10px}
  .login-form{padding:42px 38px 34px;display:flex;flex-direction:column;justify-content:center}
  .login-form h1{font-family:var(--fonte-titulo);font-size:27px;color:var(--azul);line-height:1.1}
  .login-form .conv{font-size:13px;color:var(--muted);margin:7px 0 24px}
  .senha-campo{position:relative}
  .senha-campo input{padding-right:40px}
  .olho{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;
    padding:5px 7px;line-height:0;color:var(--muted);border-radius:6px;display:flex}
  .olho:hover{background:var(--surface-2);color:var(--azul)}
  .lembrar{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink);margin:2px 0 18px;cursor:pointer;user-select:none}
  .lembrar input{width:16px;height:16px;accent-color:var(--azul);cursor:pointer}
  .rodape-login{text-align:center;font-size:11.5px;color:var(--muted);margin-top:18px}
  .campo{margin-bottom:14px}
  .campo label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:5px}
  .campo input,.campo select,.campo textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);
  }
  .campo textarea{min-height:74px;resize:vertical}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;
    background:var(--azul);color:#fff;padding:9px 15px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn.full{width:100%;padding:11px}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
  .btn.ghost:hover{background:var(--surface-2);filter:none}
  .btn.turq{background:var(--turq);color:#003A32}
  .btn.perigo{background:transparent;color:var(--late);border-color:var(--late)}
  .btn.mini{padding:5px 9px;font-size:11.5px;border-radius:7px}
  @keyframes pulsa{0%,100%{box-shadow:0 0 0 0 rgba(23,227,203,0)}
    50%{box-shadow:0 0 0 5px rgba(23,227,203,.42)}}
  #btn-nova{animation:pulsa 2.4s ease-in-out infinite}
  #btn-nova:hover{animation:none}

  .aviso{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.45}
  .login-form .aviso{font-size:11.5px;border-top:1px solid var(--line);padding-top:13px;text-align:center}
  .erro{color:var(--late);font-size:12.5px;font-weight:600;margin-top:10px;min-height:17px;text-align:center}

  /* ---------- SHELL ---------- */
  /* faixa da eleição */
  .eleicao{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:9px 22px;color:#fff;font-size:12.5px;font-weight:700;
    background:linear-gradient(90deg,#001C86 0%,#0027BD 45%,#0E7C5A 100%);
  }
  .eleicao .cont{display:flex;align-items:baseline;gap:7px}
  .eleicao .dias{font-size:21px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--turq)}
  .eleicao .rot{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;font-weight:700}
  .eleicao .trilho{flex:1 1 200px;min-width:140px;height:6px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden}
  .eleicao .trilho i{display:block;height:100%;background:var(--turq);border-radius:4px}
  .eleicao .data{opacity:.85;font-weight:600}
  .eleicao.perto{background:linear-gradient(90deg,#7A1030 0%,#BE0F4B 55%,#E0740A 100%)}

  #app{display:grid;grid-template-columns:218px 1fr;min-height:100%}
  .lateral{background:var(--azul-d);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .lateral .topo{position:relative;padding:20px 14px 18px;border-bottom:1px solid rgba(255,255,255,.13)}
  .lateral .topo .marca-txt{display:flex;flex-direction:column;align-items:center;gap:1px;
    font-family:var(--fonte-titulo);font-size:21px;font-weight:800;line-height:1.02;letter-spacing:.06em;color:#fff}
  .lateral .topo .marca-txt span:last-child{color:var(--turq)}
  .recolher{position:absolute;top:12px;right:10px;background:rgba(255,255,255,.12);border:0;color:#fff;
    width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:12px;line-height:1;display:grid;place-items:center}
  .recolher:hover{background:rgba(255,255,255,.24)}
  #app.menu-off{grid-template-columns:62px 1fr}
  #app.menu-off .lateral .marca-txt,#app.menu-off .nav button .rot,
  #app.menu-off .nav .grupo,#app.menu-off .lateral .pe{display:none}
  #app.menu-off .lateral .topo{padding:44px 8px 14px}
  #app.menu-off .recolher{right:50%;transform:translateX(50%)}
  #app.menu-off .nav{padding:10px 8px}
  #app.menu-off .nav button{justify-content:center;padding:10px 0}
  .lateral .topo .sig{font-size:16px;font-weight:800;letter-spacing:.02em;line-height:1.1}
  .lateral .topo .sub{font-size:9px;letter-spacing:.15em;color:var(--turq);font-weight:700;text-transform:uppercase;margin-top:4px}
  .nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}
  .nav button{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;
    color:rgba(255,255,255,.78);padding:9px 11px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:600;
  }
  .nav button:hover{background:rgba(255,255,255,.09);color:#fff}
  .nav button[aria-current="page"]{background:#fff;color:var(--azul-d)}
  .nav .grupo{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45);padding:14px 11px 5px;font-weight:700}
  .nav .ico{width:17px;text-align:center;flex:none}
  .nav .rot{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lateral .pe{padding:12px 14px;border-top:1px solid rgba(255,255,255,.13);font-size:11px;color:rgba(255,255,255,.55);
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px}
  .lateral .pe .marcas{width:100%;max-width:168px;height:auto;opacity:.92}
  .lateral .pe .assina{font-family:var(--fonte-titulo);font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--turq);font-weight:700}
  details.mais{border:1px solid var(--line);border-radius:9px;padding:0 12px;margin-bottom:14px;background:var(--surface-2)}
  details.mais summary{cursor:pointer;padding:10px 0;font-weight:700;font-size:12px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);font-family:var(--fonte-titulo)}
  details.mais[open] summary{margin-bottom:4px;border-bottom:1px solid var(--line)}

  .conteudo{min-width:0;display:flex;flex-direction:column}
  .barra{
    position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
    padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .barra h1{font-size:19px;font-weight:800;color:var(--ink)}
  .barra .desc{font-size:12.5px;color:var(--muted)}
  .barra .dir{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .eu{display:flex;align-items:center;gap:9px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2)}
  .eu img,.eu .ini{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none}
  .eu .ini{background:var(--azul);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}
  .eu b{font-size:12.5px;display:block;line-height:1.2}
  .eu span{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
  .menu-mob{display:none}

  main{padding:20px 22px 40px;min-width:0}

  /* ---------- BLOCOS ---------- */
  .cartao{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sombra)}
  .cartao .cab{padding:14px 16px 0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .cartao .cab h2{font-size:14px;font-weight:800}
  .cartao .cab .nota{font-size:11.5px;color:var(--muted)}
  .cartao .corpo{padding:14px 16px 16px}
  .grade{display:grid;gap:14px}
  .g5{grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
  /* seis cartões: fileiras sempre fechadas, sem sobra solta na segunda linha */
  .g6{grid-template-columns:repeat(6,1fr)}
  .g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}

  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--sombra)}
  .kpi .rot{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .kpi .num{font-size:30px;font-weight:800;line-height:1.05;margin-top:5px;font-variant-numeric:tabular-nums}
  .kpi .pe{font-size:11.5px;color:var(--muted);margin-top:3px}

  .tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.03em;white-space:nowrap}
  .tag.ok{background:var(--good-bg);color:var(--good)}
  .tag.at{background:var(--warn-bg);color:var(--warn)}
  .tag.no{background:var(--late-bg);color:var(--late)}
  .tag.n{background:var(--s1);color:var(--s6)}
  .tag.st{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tfoot td{border-bottom:0;border-top:2px solid var(--line-2);background:var(--surface-2)}
  tbody tr:hover{background:var(--surface-2)}
  .rolar{overflow-x:auto}
  .vazio{padding:30px 16px;text-align:center;color:var(--muted);font-size:13px}

  .atalhos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .chip-p{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
    color:var(--muted);font-family:var(--fonte);font-size:12px;font-weight:600;cursor:pointer;transition:.12s}
  .chip-p:hover{border-color:var(--azul);color:var(--azul)}
  .chip-p.on{background:var(--azul);border-color:var(--azul);color:#fff}

  .subabas{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:0}
  .sub{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;
    font-family:var(--fonte-titulo);font-size:13px;font-weight:700;padding:8px 14px 9px;margin-bottom:-1px}
  .sub:hover{color:var(--azul)}
  .sub.on{color:var(--azul);border-bottom-color:var(--azul)}

  table.compacta td{padding:6px 10px}
  table.compacta th{padding:6px 10px}

  .filtros{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
  .filtros .campo{margin:0;min-width:140px}
  .filtros .campo label{font-size:10px}
  .filtros .campo input,.filtros .campo select{padding:7px 9px;background:var(--surface);font-size:13px}

  /* ---------- KANBAN ---------- */
  .kb{display:grid;grid-template-columns:repeat(4,minmax(232px,1fr));gap:12px;align-items:start}
  .col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);min-height:150px;display:flex;flex-direction:column}
  .col.alvo{border-color:var(--azul);box-shadow:0 0 0 2px rgba(0,39,189,.15)}
  .col > .cab{padding:11px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .col .bolinha{width:9px;height:9px;border-radius:50%;flex:none}
  .col .cab b{font-size:12px;letter-spacing:.05em;text-transform:uppercase}
  .col .cab .qtd{margin-left:auto;font-size:11px;font-weight:800;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
  .col .lista{padding:10px;display:flex;flex-direction:column;gap:9px;max-height:min(66vh,760px);overflow-y:auto}
  .ficha{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 11px;cursor:grab;box-shadow:var(--sombra)}
  .ficha:active{cursor:grabbing}
  .ficha.arrastando{opacity:.45}
  .ficha h4{font-size:13px;font-weight:700;margin:0 0 6px;line-height:1.3}
  .ficha .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:10.5px;color:var(--muted)}
  .ficha .pes{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--ink-2)}
  .ficha .pes img{width:20px;height:20px;border-radius:50%;object-fit:cover}
  .ficha .barrinha{height:3px;border-radius:3px;background:var(--line);margin-top:9px;overflow:hidden}
  .ficha .barrinha i{display:block;height:100%;border-radius:3px}

  /* ---------- MODAL ---------- */
  .fundo{position:fixed;inset:0;background:rgba(7,15,35,.5);display:grid;place-items:center;padding:16px;z-index:80;backdrop-filter:blur(2px)}
  .janela{background:var(--surface);border-radius:14px;width:min(680px,100%);max-height:88vh;overflow:auto;box-shadow:0 30px 70px rgba(0,10,50,.4)}
  .janela .cab{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--surface);z-index:2}
  .janela .cab h3{font-size:16px;font-weight:800}
  .janela .cab .fechar{margin-left:auto;background:transparent;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
  .janela .corpo{padding:18px 20px}
  .janela .pe{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface)}
  .dupla{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .checks{display:flex;flex-wrap:wrap;gap:7px}
  .checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;background:var(--surface-2)}
  .checks input{margin:0}

  .aba{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:0}
  .aba button{background:transparent;border:0;border-bottom:2px solid transparent;padding:8px 12px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
  .aba button[aria-selected="true"]{color:var(--azul);border-bottom-color:var(--azul)}

  .sino{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 12px 30px rgba(0,0,0,.3)}

  .barrachart{display:flex;flex-direction:column;gap:9px}
  .linha-barra{display:grid;grid-template-columns:118px 1fr 52px;gap:10px;align-items:center;font-size:12.5px}
  .linha-barra .rot{color:var(--ink-2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .linha-barra .trilho{background:var(--surface-2);border-radius:5px;height:16px;overflow:hidden}
  .linha-barra .trilho i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--s6)}
  .linha-barra .val{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}

  .medidor{height:12px;border-radius:7px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
  .medidor i{display:block;height:100%;border-radius:0 6px 6px 0;background:var(--s6)}

  .mapa-wrap{position:relative}
  .mapa-wrap svg{overflow:visible}
  svg .mun{transition:transform .18s cubic-bezier(.2,.7,.3,1),filter .18s;transform-origin:center;transform-box:fill-box;cursor:pointer}
  svg .mun:hover{filter:brightness(1.1) drop-shadow(0 6px 14px rgba(0,39,189,.35));transform:translateY(-4px) scale(1.015)}
  svg .mun.sel{filter:drop-shadow(0 8px 18px rgba(0,39,189,.45))}
  svg .rotulo{font-size:30px;font-weight:800;pointer-events:none;paint-order:stroke;stroke-width:9px;stroke-linejoin:round}
  svg .rotulo .qt{font-size:40px}
  .legenda-mapa{display:flex;align-items:center;gap:0;margin-top:10px}
  .legenda-mapa i{display:block;width:30px;height:10px}
  .legenda-mapa i:first-of-type{border-radius:5px 0 0 5px}
  .legenda-mapa i:last-of-type{border-radius:0 5px 5px 0}

  /* régua diária */
  .regua{display:flex;align-items:flex-end;gap:2px;height:170px;padding-top:18px}
  .regua .dia{flex:1 1 0;min-width:4px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
  .regua .dia i{display:block;border-radius:3px 3px 0 0;background:linear-gradient(180deg,var(--s4),var(--s6));transition:filter .15s}
  .regua .dia.hoje i{background:linear-gradient(180deg,var(--turq),#00A48C)}
  .regua .dia.fds i{opacity:.45}
  .regua .dia:hover i{filter:brightness(1.2)}
  .regua .dia b{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10px;font-weight:800;color:var(--ink-2)}
  .regua-eixo{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:7px;border-top:1px solid var(--line);padding-top:6px}
  .linha-meta{position:absolute;left:0;right:0;border-top:2px dashed var(--late);opacity:.55}

  /* mapa de calor analista x dia */
  .calor{display:grid;gap:3px;align-items:center;font-size:11.5px}
  .calor .nome{padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2);font-weight:600}
  .calor .cel{aspect-ratio:1;border-radius:3px;background:var(--surface-2);min-height:13px}

  /* selo de aprovação */
  .selo{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;letter-spacing:.04em;padding:2px 7px;border-radius:999px;background:var(--good-bg);color:var(--good);border:1px solid color-mix(in srgb,var(--good) 35%,transparent)}
  .selo.pend{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
  .kb5{display:grid;grid-template-columns:repeat(5,minmax(216px,1fr));gap:12px;align-items:start}
  .matriz td{text-align:center}
  .matriz td:first-child,.matriz th:first-child{text-align:left}

  .dica{position:fixed;pointer-events:none;background:var(--ink);color:#fff;padding:7px 10px;border-radius:7px;font-size:12px;z-index:300;box-shadow:0 8px 22px rgba(0,0,0,.28);max-width:230px}
  .dica b{display:block;font-size:12.5px}

.anexos{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px}
  .anexo{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}
  .anexo img,.anexo video{width:100%;height:230px;object-fit:contain;display:block;background:var(--ground);cursor:zoom-in}
  .anexo audio{margin:14px 8px 4px}
  .anexo .arq{height:230px;display:grid;place-items:center;font-weight:800;color:var(--muted);font-size:13px;cursor:zoom-in}
  .lupa{position:fixed;inset:0;background:rgba(5,12,32,.88);z-index:300;display:grid;place-items:center;padding:24px;cursor:zoom-out}
  .lupa img,.lupa iframe{max-width:96vw;max-height:92vh;border-radius:10px;background:#fff}
  .lupa iframe{width:min(1100px,96vw);height:92vh;border:0}
  .anexo .pe{display:flex;align-items:center;gap:6px;padding:7px 9px;font-size:11px;border-top:1px solid var(--line)}
  .anexo .pe span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .anexo .pe .tam{color:var(--muted);white-space:nowrap}
  .resumo-ap{display:flex;flex-direction:column;gap:14px}
  .resumo-ap .dados{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;

/* Adaptador do Power Pages. Ativa trocando CFG.backend para 'dataverse'.
   Cada registro do sistema vira uma linha da tabela, com o JSON no campo
   cr9d4_dados e a chave de negócio em cr9d4_chave, o que evita criar
   dezenas de colunas no Dataverse e mantém o schema estável. */
const Dataverse = {
  async token() {
    if (window.shell && window.shell.getTokenDeferred) return await window.shell.getTokenDeferred();
    const r = await fetch('/_layout/tokenhtml', { credentials: 'same-origin' });
    const t = await r.text();
    return (t.match(/value="([^"]+)"/) || [])[1] || '';
  },
  set(col) { return CFG.dataverse[col]; },
  async ler(col) {
    const r = await fetch(`/_api/${this.set(col)}?$select=cr9d4_chave,cr9d4_dados`, {
      headers: { 'Accept': 'application/json' }, credentials: 'same-origin'
    });
    if (!r.ok) throw new Error('Falha ao ler ' + col);
    const j = await r.json();
    return (j.value || []).map((x) => Object.assign(JSON.parse(x.cr9d4_dados || '{}'), { _row: x[this.set(col).replace(/s$/, '') + 'id'] }));
  },
  async gravar(col, arr) {
    // grava em lote: o sistema chama isto depois de alterar a coleção inteira.
    const tk = await this.token();
    for (const o of arr.filter((x) => x._sujo)) {
      const corpo = JSON.stringify({ cr9d4_chave: o.id, cr9d4_dados: JSON.stringify(o) });
      const url = o._row ? `/_api/${this.set(col)}(${o._row})` : `/_api/${this.set(col)}`;
      await fetch(url, {
        method: o._row ? 'PATCH' : 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', '__RequestVerificationToken': tk }, body: corpo
      });
      delete o._sujo;
    }
  }
};

/* Adaptador do Supabase, para subir o sistema na Vercel.
   Tudo mora em uma tabela só (gca_registros), com três colunas:
   id (texto), colecao (texto) e dados (jsonb). O SQL está no guia de publicação. */
const Supabase = {
  base() { return String(CFG.supabase.url || '').replace(/\/+$/, '') + '/rest/v1/' + CFG.supabase.tabela; },
  cab(extra) {
    return Object.assign({
      apikey: CFG.supabase.anon,
      Authorization: 'Bearer ' + (S.token || CFG.supabase.anon),
      'Content-Type': 'application/json'
    }, extra || {});
  },
  async ler(col) {
    const r = await fetch(this.base() + '?select=dados&colecao=eq.' + encodeURIComponent(col), { headers: this.cab() });
    if (!r.ok) throw new Error('Supabase não leu ' + col + ' (' + r.status + ')');
    return (await r.json()).map((x) => x.dados).filter(Boolean);
  },
  async gravar(col, arr) {
    const linhas = arr.map((o) => {
      const d = Object.assign({}, o); delete d._sujo; delete d._row;
      return { id: o.id, colecao: col, dados: d };
    });
    if (linhas.length) {
      const r = await fetch(this.base() + '?on_conflict=id', {
        method: 'POST',
        headers: this.cab({ Prefer: 'resolution=merge-duplicates,return=minimal' }),
        body: JSON.stringify(linhas)
      });
      if (!r.ok) throw new Error('Supabase não gravou ' + col + ' (' + r.status + ')');
    }
    /* o que sumiu da coleção sai da tabela também */
    const ids = linhas.map((l) => '"' + String(l.id).replace(/"/g, '') + '"').join(',');
    await fetch(this.base() + '?colecao=eq.' + encodeURIComponent(col) + (ids ? '&id=not.in.(' + ids + ')' : ''),
      { method: 'DELETE', headers: this.cab({ Prefer: 'return=minimal' }) });
  }
};

const REMOTO = CFG.backend === 'dataverse' || CFG.backend === 'supabase';
const API = CFG.backend === 'dataverse' ? Dataverse : CFG.backend === 'supabase' ? Supabase : Local;

const DB = {
  cache: {},
  get(col) { if (!this.cache[col]) this.cache[col] = API.ler(col) || []; return this.cache[col]; },
  set(col, arr) {
    this.cache[col] = arr;
    const p = API.gravar(col, arr);
    if (p && p.catch) p.catch((e) => { console.warn(e); toast('Não consegui gravar ' + col + '. Confira a conexão.'); });
  },
  add(col, obj) { obj.id = obj.id || uid(); obj._sujo = 1; const a = this.get(col); a.push(obj); this.set(col, a); return obj; },
  upd(col, obj) { obj._sujo = 1; const a = this.get(col).map((o) => (o.id === obj.id ? Object.assign(o, obj) : o)); this.set(col, a); return obj; },
  del(col, id) { this.set(col, this.get(col).filter((o) => o.id !== id)); },
  param(k, v) {
    const p = this.get('params')[0] || { id: 'p1' };
    if (v === undefined) return p[k];
    p[k] = v; p._sujo = 1; this.set('params', [p]); return v;
  }
};

function perfis() {

  });
  salvos.forEach((s) => { if (!fora.some((x) => x.id === s.id)) fora.push(s); });

/* concluído já quer dizer aprovado: só a coordenação move o card para lá */
const conta = (a) => a.status === 'concluido';
const parada = (a) => a.status === 'standby';
const ativa = (a) => !parada(a);
const estaAtrasada = (a) => ativa(a) && !conta(a) && a.prazo && a.prazo < hoje();
const noPrazo = (a) => conta(a) && a.concluidoEm && a.prazo && a.concluidoEm <= a.prazo;

/* checklist: o que ainda falta preencher na ação */
function checklistDe(a) {
  const falta = [];
  if (!a.titulo) falta.push('título');
  if (!a.analistaId) falta.push('responsável');
  if (!a.tipoId) falta.push('tipo');
  if (!(a.canais || []).length) falta.push('canal');
  if (!a.municipio) falta.push('município');
  if (a.status === 'concluido' && !urlSegura(a.linkDrive)) falta.push('link');
  return { ok: falta.length === 0, falta };
}

function saudeDe(a) {
  if (parada(a)) return { c: 'st', t: 'Stand-by' };
  if (conta(a)) return noPrazo(a) ? { c: 'ok', t: 'No prazo' } : { c: 'no', t: 'Fora do prazo' };
  if (estaAtrasada(a)) return { c: 'no', t: 'Atrasada' };
  if (a.prazo && difDias(hoje(), a.prazo) <= (DB.param('diasAlerta') || 1)) return { c: 'at', t: 'Vence hoje' };
  return { c: 'ok', t: 'Em dia' };
}

/* dias que faltam para a eleição */
function contagemEleicao() {
  const alvo = DB.param('dataEleicao') || ELEICAO;
  const faltam = difDias(hoje(), alvo);
  const inicio = DB.param('inicioOperacao') || '2026-08-01';
  const total = Math.max(1, difDias(inicio, alvo));
  return { alvo, faltam, total, corrido: Math.max(0, Math.min(total, total - faltam)) };
}

/* matriz de acesso por perfil, editável em Parâmetros */
/* mapas de acesso salvos por versões antigas usavam outros nomes de tela */
const TELA_ANTIGA = {
  cadastros: 'config', parametros: 'config', usuarios: 'config', dados: 'config',
  admin: 'config', kanban: 'acoes', mapa: 'acoes', acao: 'acoes'
};
function arrumarTelas(lista, perfil) {
  const fora = [];
  (lista || []).forEach((t) => {
    const n = TELA_ANTIGA[t] || t;
    if (TELAS.includes(n) && !fora.includes(n)) fora.push(n);
  });
  if (perfil === 'admin') TELAS.forEach((t) => { if (!fora.includes(t)) fora.push(t); });
  return fora.length ? fora : (ACESSO_PADRAO[perfil] || []);
}
/* perfil sem matriz salva ganha as abas que combinam com os poderes dele */
function telasPelosPoderes(perfil) {
  const p = perfilDe(perfil);
  const l = ['painel', 'acoes', 'repercussao', 'relatorios'];
  if (p.aprovar) l.push('aprovacoes');
  if (p.gerencial) l.push('squads');
  return l;
}
function acessosDe(perfil) {
  const m = DB.param('acessos') || {};
  const base = m[perfil] || ACESSO_PADRAO[perfil] || telasPelosPoderes(perfil);
  return arrumarTelas(base, perfil);
}
function pode(o) {
  const u = S.user || {};
  if (!u.perfil) return false;
  /* se a pessoa tem abas marcadas no cadastro dela, vale a lista dela */
  const lista = (u.telas && u.telas.length) ? u.telas : acessosDe(u.perfil);
  if (TELAS.includes(o)) return lista.includes(o);
  if (o === 'aprovar' || o === 'excluir' || o === 'gerencial') return !!perfilDe(u.perfil)[o];
  /* nomes antigos de tela ainda usados no código: 'cadastros' vale por 'config' */
  if (TELA_ANTIGA[o]) return lista.includes(TELA_ANTIGA[o]);
  return lista.includes(o);
}
function squadsDoUsuario(u) {
  const l = [];
  if (u.squadId) l.push(u.squadId);
  (u.squadsExtra || []).forEach((x) => { if (x && !l.includes(x)) l.push(x); });
  return l;
}
function minhasAcoes(lista) {
  const u = S.user || {};
  if (pode('gerencial')) return lista;
  const sq = squadsDoUsuario(u);
  return sq.length ? lista.filter((a) => sq.includes(a.squadId)) : lista;
}

/* aceita o e-mail Aegea completo ou só o nome curto antes do @ */
function acharUsuario(v) {
  const t = String(v || '').trim().toLowerCase();
  if (!t) return null;
  const curto = t.split('@')[0];
  return DB.get('usuarios').find((x) => x.ativo && (
    String(x.email || '').toLowerCase() === t || x.login === t || x.login === curto));
}
/* sistema sem ninguém cadastrado: a tela de entrada vira criação do primeiro acesso */
const semNinguem = () => !DB.get('usuarios').length;

function telaPrimeiroAcesso() {
  $('#login-aviso').innerHTML = 'Este é o primeiro acesso. A conta criada aqui fica como administradora do sistema.';
  $('.login-form h1').textContent = 'Criar o primeiro acesso';
  $('.login-form .conv').textContent = 'Ninguém foi cadastrado ainda. Crie a conta da coordenação para começar.';
  $('.login-form button[type=submit]').textContent = 'Criar e entrar';

  const campoNome = document.createElement('div');
  campoNome.className = 'campo';
  campoNome.innerHTML = '<label for="u-nome">Nome</label>' +
    '<input id="u-nome" type="text" autocomplete="name" placeholder="Nome e sobrenome" required>';
  $('.login-form .campo').before(campoNome);

  /* Um campo de senha só. Dois campos faziam o gerenciador do navegador
     preencher o de repetir e deixar o primeiro vazio, e a tela travava.
     Em vez de pedir para digitar duas vezes, a senha já aparece na tela:
     a pessoa confere lendo, e o olho esconde quando ela quiser. */
  const s = $('#u-senha');
  s.setAttribute('autocomplete', 'new-password');
  s.setAttribute('placeholder', 'Ao menos 8 caracteres');
  s.type = 'text';
  const olho = $('#ver-senha');
  if (olho) {
    olho.style.color = 'var(--azul)';
    olho.setAttribute('aria-label', 'Esconder a senha');
    olho.setAttribute('title', 'Esconder a senha');
    const corte = $('#olho-corte'); if (corte) corte.style.display = '';
  }
  const lembrar = $('.lembrar'); if (lembrar) lembrar.hidden = true;

  const dica = document.createElement('p');
  dica.style.cssText = 'font-size:12px;color:var(--muted);margin:-8px 0 14px';
  dica.textContent = 'Anote esta senha. O sistema não tem recuperação: quem esquece precisa de outra pessoa da coordenação para redefinir.';
  s.closest('.campo').after(dica);

  $('#form-login').addEventListener('submit', (e) => {
    e.preventDefault();
    const nome = $('#u-nome').value.trim();
    const email = $('#u-user').value.trim().toLowerCase();
    const s1 = $('#u-senha').value;
    const erro = $('#login-erro');
    if (nome.split(' ').filter(Boolean).length < 2) { erro.textContent = 'Escreva o nome e o sobrenome.'; return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { erro.textContent = 'Escreva um e-mail válido.'; return; }
    if (s1.length < SENHA_MIN) { erro.textContent = 'A senha precisa de ao menos ' + SENHA_MIN + ' caracteres.'; return; }
    const u = DB.add('usuarios', {
      login: email.split('@')[0], nome, email, perfil: 'admin',
      analistaId: '', squadId: '', senha: s1, ativo: true
    });
    erro.textContent = '';
    entrar(u);
    toast('Conta criada. Cadastre as squads e o time em Configuração.');
  });
}

function iniciarLogin() {
  $('#logo-login').src = ASSETS.fotos.logo || '';
  const lm = $('#logo-marcas-login');
  if (lm) { if (ASSETS.fotos.logo_marcas) lm.src = ASSETS.fotos.logo_marcas; else lm.remove(); }
  $('#login-aviso').innerHTML = 'Problema para entrar? Fale com a coordenação da Comunicação.';

  $('#ver-senha').addEventListener('click', () => {
    const c = $('#u-senha'), ver = c.type === 'password';
    c.type = ver ? 'text' : 'password';
    const b = $('#ver-senha');
    b.setAttribute('aria-label', ver ? 'Esconder a senha' : 'Mostrar a senha');
    b.setAttribute('title', ver ? 'Esconder a senha' : 'Mostrar a senha');
    b.style.color = ver ? 'var(--azul)' : '';
    $('#olho-corte').style.display = ver ? '' : 'none';
    c.focus();
  });

  if (semNinguem()) return telaPrimeiroAcesso();

  let lembrado = '';
  try { lembrado = localStorage.getItem(CFG.chave + ':email') || ''; } catch (e) { }
  if (lembrado) { $('#u-user').value = lembrado; $('#u-lembrar').checked = true; setTimeout(() => $('#u-senha').focus(), 60); }

  $('#form-login').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = $('#u-user').value, s = $('#u-senha').value;
    const u = acharUsuario(v);
    if (!u || !u.senha || u.senha !== s) { $('#login-erro').textContent = 'E-mail ou senha não conferem.'; return; }
    if (u.ativo === false) { $('#login-erro').textContent = 'Esse acesso está inativo. Fale com a coordenação.'; return; }
    try {
      if ($('#u-lembrar').checked) localStorage.setItem(CFG.chave + ':email', v.trim().toLowerCase());
      else localStorage.removeItem(CFG.chave + ':email');
    } catch (er) { }
    entrar(u);
  });
}
function entrar(u) {
  S.user = u;
  try { sessionStorage.setItem(CFG.chave + ':sessao', u.id); } catch (e) { }
  $('#login').hidden = true; $('#app').hidden = false;
  registrar('Entrou no sistema');
  montarShell(); ir('painel');
}
function sair() {
  S.user = null;
  try { sessionStorage.removeItem(CFG.chave + ':sessao'); } catch (e) { }
  $('#app').hidden = true; $('#login').hidden = false;
  $('#u-senha').value = ''; $('#login-erro').textContent = '';
}

function campo(f, valor) {
  const v = valor ?? f.padrao ?? '';
  const id = 'f_' + f.k;
  let ctrl = '';
  if (f.t === 'select') {
    ctrl = `<select id="${id}" data-k="${f.k}">${f.vazio === false ? '' : '<option value="">—</option>'}
      ${f.opcoes.map((o) => `<option value="${esc(o.v)}" ${String(o.v) === String(v) ? 'selected' : ''}>${esc(o.t)}</option>`).join('')}</select>`;
  } else if (f.t === 'textarea') {
    ctrl = `<textarea id="${id}" data-k="${f.k}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
  } else if (f.t === 'checks') {
    const sel = Array.isArray(v) ? v : [];
    ctrl = `<div class="checks" data-k="${f.k}" data-multi="1">${f.opcoes.map((o) =>
      `<label><input type="checkbox" value="${esc(o.v)}" ${sel.includes(o.v) ? 'checked' : ''}>${esc(o.t)}</label>`).join('')}</div>`;
  } else {
    ctrl = `<input id="${id}" data-k="${f.k}" type="${f.t || 'text'}" value="${esc(v)}" placeholder="${esc(f.ph || '')}" ${f.req ? 'required' : ''} ${f.list ? `list="${f.list}"` : ''}>`;
  }
  return `<div class="campo"><label for="${id}">${esc(f.l)}${f.req ? ' *' : ''}</label>${ctrl}
    ${f.nota ? `<div style="font-size:11.5px;color:var(--muted);margin-top:4px">${f.nota}</div>` : ''}</div>`;
}
function lerFormulario(raiz) {
  const o = {};
  $$('[data-k]', raiz).forEach((el) => {
    if (el.dataset.multi) o[el.dataset.k] = $$('input:checked', el).map((i) => i.value);
    else o[el.dataset.k] = el.type === 'number' ? (el.value === '' ? '' : Number(el.value)) : el.value.trim ? el.value.trim() : el.value;
  });
  return o;
}

}

/* deixa GUERRI e LHEIROS com a mesma largura, seja qual for a fonte */
function ajustarMarca() {
  const cx = $('.lateral .marca-txt'); if (!cx) return;
  const [a, b] = Array.from(cx.children);
  if (!a || !b) return;
  a.style.letterSpacing = b.style.letterSpacing = '0.06em';
  a.style.textIndent = b.style.textIndent = '0px';
  const la = a.getBoundingClientRect().width, lb = b.getBoundingClientRect().width;
  if (!la || !lb) return;
  const menor = la < lb ? a : b;
  const dif = Math.abs(lb - la);
  const vaos = Math.max(1, menor.textContent.length - 1);
  const atual = parseFloat(getComputedStyle(menor).letterSpacing) || 0;
  const novo = atual + dif / vaos;
  menor.style.letterSpacing = novo.toFixed(2) + 'px';
  menor.style.textIndent = (novo / 2).toFixed(2) + 'px';
}

/* ---- filtros comuns ---- */
function periodo(lista) {
  const f = S.filtros;
  return lista.filter((a) => (!f.de || a.criadoEm >= f.de) && (!f.ate || a.criadoEm <= f.ate)
    && (!f.squad || a.squadId === f.squad) && (!f.analista || a.analistaId === f.analista)
    && (!f.tipo || a.tipoId === f.tipo) && (!f.status || a.status === f.status) && (!f.marca || a.marcaId === f.marca)
    && (!f.busca || (a.titulo || '').toLowerCase().includes(f.busca.toLowerCase())));
}
/* atalhos de período: primeiro dia e último dia de cada janela */
const ymd = (a, m, d) => { const x = new Date(a, m, d); const p = (n) => String(n).padStart(2, '0'); return `${x.getFullYear()}-${p(x.getMonth() + 1)}-${p(x.getDate())}`; };
const PRESETS = {

  d7: () => [somaDias(hoje(), -6), hoje()],
  d30: () => [somaDias(hoje(), -29), hoje()],
  mes: () => { const d = new Date(); return [ymd(d.getFullYear(), d.getMonth(), 1), ymd(d.getFullYear(), d.getMonth() + 1, 0)]; },
  mesPassado: () => { const d = new Date(); return [ymd(d.getFullYear(), d.getMonth() - 1, 1), ymd(d.getFullYear(), d.getMonth(), 0)]; },
  tudo: () => ['2020-01-01', '2099-12-31']
};

/* ---- PAINEL ---- */
function telaPainel() {
  const todas = minhasAcoes(DB.get('acoes'));
  const A = periodo(todas);
  const vivas = A.filter(ativa);
  const porSt = (st) => A.filter((a) => a.status === st).length;
  const val = A.filter(conta);
  const atras = A.filter(estaAtrasada);
  const naFila = A.filter((a) => a.status === 'aprovacao');

  const meus = squadsDoUsuario(S.user);
  const squads = DB.get('squads').filter((q) => pode('gerencial') || !meus.length || meus.includes(q.id));
  const metaDia = squads.reduce((x, q) => x + (Number(q.metaDia) || 0), 0);
  const feitoHoje = todas.filter((a) => conta(a) && a.concluidoEm === hoje()).length;

  /* régua de todos os dias do período; janela muito larga vira os últimos 45 dias */
  const ateReg = S.filtros.ate > hoje() ? hoje() : S.filtros.ate;
  const bruto = difDias(S.filtros.de, ateReg) + 1;
  const largo = bruto > 60 || bruto < 1;
  const qtd = largo ? 45 : bruto;
  const de = largo ? somaDias(ateReg, -(qtd - 1)) : S.filtros.de;
  const ate = ateReg;
  const dias = Array.from({ length: qtd }, (_, i) => somaDias(de, i));
  const serie = dias.map((d) => ({ d, v: todas.filter((a) => conta(a) && a.concluidoEm === d).length }));
  const maxDados = Math.max(1, ...serie.map((x) => x.v));
  const metaCabe = metaDia <= maxDados * 3;
  const maxSerie = metaCabe ? Math.max(maxDados, metaDia) : maxDados;
  const totalPer = serie.reduce((x, y) => x + y.v, 0);
  const mediaDia = (totalPer / qtd).toFixed(1);
  const passo = qtd > 40 ? 7 : qtd > 18 ? 3 : 1;

  const rankSquad = squads.map((q) => {
    const da = A.filter((a) => a.squadId === q.id);
    const c = da.filter(conta);
    return { id: q.id, n: q.nome, v: c.length, total: da.filter(ativa).length, prazo: pct(c.filter(noPrazo).length, c.length) };
  }).sort((a, b) => b.v - a.v);

  const meusSq = squadsDoUsuario(S.user);
  const gente = DB.get('analistas').filter((an) => an.ativo && (pode('gerencial') || meusSq.includes(an.squadId)));
  const rankAnalista = gente.map((an) => {
    const da = A.filter((a) => a.analistaId === an.id);
    return { id: an.id, n: an.nome.split(' ').slice(0, 2).join(' '), foto: an.foto, v: da.filter(conta).length, total: da.filter(ativa).length };
  }).filter((r) => r.total).sort((a, b) => b.v - a.v);

  /* mapa de calor: analista x últimos 21 dias */
  const diasCalor = Array.from({ length: 21 }, (_, i) => somaDias(hoje(), -20 + i));
  const calor = gente.map((an) => ({
    n: an.nome.split(' ')[0],
    dias: diasCalor.map((d) => todas.filter((a) => a.analistaId === an.id && conta(a) && a.concluidoEm === d).length)
  })).filter((r) => r.dias.some((v) => v));
  const maxCalor = Math.max(1, ...calor.flatMap((r) => r.dias));
  const tomCalor = (v) => v === 0 ? 'var(--surface-2)' : ['var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)'][Math.min(4, Math.round((v / maxCalor) * 4))];

  const porTipo = DB.get('tipos').map((t) => ({ n: t.nome, v: vivas.filter((a) => a.tipoId === t.id).length }))
    .filter((d) => d.v).sort((a, b) => b.v - a.v);

  /* total por regional, com a meta proporcional aos dias que já passaram.
     A janela nunca começa antes do início da operação nem passa de hoje. */
  const inicioOp = DB.param('inicioOperacao') || S.filtros.de;
  const mDe = S.filtros.de > inicioOp ? S.filtros.de : inicioOp;
  const mAte = S.filtros.ate > hoje() ? hoje() : S.filtros.ate;
  const diasMeta = Math.max(1, difDias(mDe, mAte) + 1);
  const RP = periodoRep(minhasReps(DB.get('repercussoes')));
  const porRegional = squads.map((q) => {
    const da = A.filter((a) => a.squadId === q.id);
    return {
      id: q.id, n: q.nome, tipo: q.tipo || '',
      total: da.filter(ativa).length,
      prod: da.filter((a) => a.status === 'producao').length,
      apr: da.filter((a) => a.status === 'aprovacao').length,
      feito: da.filter(conta).length,
      atras: da.filter(estaAtrasada).length,
      meta: (Number(q.metaDia) || 0) * diasMeta,
      rep: RP.filter((r) => r.squadId === q.id).length
    };
  }).sort((a, b) => b.feito - a.feito);
  const somaReg = (k) => porRegional.reduce((x, r) => x + r[k], 0);

  return `
  ${barraFiltros(['de', 'ate', 'squad', 'marca'])}

  <div class="grade g6" style="margin-bottom:14px">
    ${[
      ['Concluídas', val.length, 'liberadas pela coordenação', 'var(--good)'],
      ['Em produção', porSt('producao'), 'sendo feitas agora', 'var(--ink)'],
      ['Em aprovação', naFila.length, 'esperando a coordenação', naFila.length ? 'var(--warn)' : 'var(--ink)'],
      ['Atrasadas', atras.length, atras.length ? 'passaram do prazo' : 'nenhuma pendência', atras.length ? 'var(--late)' : 'var(--ink)'],
      ['Stand-by', porSt('standby'), 'fora da contagem', 'var(--muted)'],
      ['Checklist OK', A.filter((a) => checklistDe(a).ok).length, `de ${A.length} cadastradas`, 'var(--good)']
    ].map(([r, n, p, cor]) => `<div class="kpi">
        <div class="rot">${r}</div><div class="num" style="color:${cor}">${num(n)}</div><div class="pe">${p}</div>
      </div>`).join('')}
  </div>

  <div class="cartao" style="margin-bottom:14px">
    <div class="cab"><h2>Régua diária de produção</h2>
      <span class="nota">${fmtData(de)} a ${fmtData(ate)} · ${qtd} dias · ${totalPer} conteúdos concluídos · média de ${mediaDia} por dia${largo ? ' (janela longa: a régua mostra os últimos 45 dias)' : ''}</span>
      <span style="margin-left:auto;font-size:11.5px;color:var(--late);font-weight:700">${metaCabe ? '- - - ' : ''}meta de ${metaDia}/dia${metaCabe ? '' : ' (ainda acima da escala)'}</span></div>
    <div class="corpo">
      <div style="position:relative">
        <div class="regua">
          ${serie.map((x) => {
            const fds = [0, 6].includes(new Date(x.d + 'T12:00:00').getDay());
            return `<span class="dia ${x.d === hoje() ? 'hoje' : ''} ${fds ? 'fds' : ''}" title="${fmtData(x.d)}: ${x.v} validados">
              ${x.v && qtd <= 45 ? `<b>${x.v}</b>` : ''}
              <i style="height:${Math.max(3, (x.v / maxSerie) * 145)}px"></i></span>`;
          }).join('')}
        </div>
        ${metaCabe ? `<div class="linha-meta" style="bottom:${(metaDia / maxSerie) * 145}px"></div>` : ''}
      </div>
      <div class="regua-eixo">${dias.map((d, i) => (i % passo === 0 || i === qtd - 1)
        ? `<span style="flex:1;text-align:${i === 0 ? 'left' : i === qtd - 1 ? 'right' : 'center'}">${d.slice(8, 10)}/${d.slice(5, 7)}</span>` : '').join('')}</div>
    </div>
  </div>

  <div class="grade g2" style="margin-bottom:14px">
    <div class="cartao"><div class="cab"><h2>Meta de hoje</h2><span class="nota">conta o que a coordenação liberou</span></div>
      <div class="corpo">
        <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:9px">
          <span style="font-size:34px;font-weight:800;font-variant-numeric:tabular-nums">${feitoHoje}</span>
          <span style="color:var(--muted);font-size:13px">de ${metaDia} conteúdos</span>
          <span class="tag ${feitoHoje >= metaDia ? 'ok' : 'at'}" style="margin-left:auto">${pct(feitoHoje, metaDia)}%</span>
        </div>
        <div class="medidor"><i style="width:${Math.min(100, pct(feitoHoje, metaDia))}%;background:${feitoHoje >= metaDia ? 'var(--good)' : 'var(--s6)'}"></i></div>
        ${naFila.length ? `<div style="margin-top:13px;font-size:12.5px;color:var(--warn);font-weight:600">${naFila.length} ${naFila.length === 1 ? 'conteúdo espera' : 'conteúdos esperam'} a liberação da coordenação.</div>` : ''}
      </div></div>

    <div class="cartao"><div class="cab"><h2>Trabalho por dia de cada analista</h2><span class="nota">últimos 21 dias</span></div>
      <div class="corpo rolar">${calor.length ? `
        <div class="calor" style="grid-template-columns:96px repeat(21,1fr)">
          ${calor.map((r) => `<span class="nome" title="${esc(r.n)}">${esc(r.n)}</span>
            ${r.dias.map((v, i) => `<span class="cel" style="background:${tomCalor(v)}" title="${esc(r.n)} · ${fmtData(diasCalor[i])}: ${v}"></span>`).join('')}`).join('')}
        </div>
        <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:7px">
          <span>${fmtData(diasCalor[0])}</span><span>hoje</span></div>`
        : '<div class="vazio">Ninguém concluiu conteúdo nos últimos 21 dias.</div>'}
      </div></div>
  </div>

  <div class="cartao" style="margin-bottom:14px">
    <div class="cab"><h2>Total por regional</h2>
      <span class="nota">${fmtData(mDe)} a ${fmtData(mAte)} · ${diasMeta} ${diasMeta === 1 ? 'dia' : 'dias'} de operação · clique na linha para filtrar tudo por ela</span></div>
    <div class="corpo rolar" style="padding-top:8px"><table>
      <thead><tr><th>Regional</th><th style="text-align:right">Ações</th><th style="text-align:right">Em produção</th>
        <th style="text-align:right">Em aprovação</th><th style="text-align:right">Concluídas</th><th style="text-align:right">Atrasadas</th>
        <th style="text-align:right">Repercussões</th><th style="width:170px">Meta do período</th></tr></thead>
      <tbody>${porRegional.map((r) => {
        const p = pct(r.feito, r.meta);
        const sel = S.filtros.squad === r.id;
        return `<tr data-act="filtra-squad" data-id="${r.id}" style="cursor:pointer${sel ? ';background:var(--surface-2)' : ''}">
          <td><b>${esc(r.n)}</b>${sel ? ' <span class="tag n">filtrando</span>' : ''}
            <div style="font-size:11px;color:var(--muted)">${esc(r.tipo)}</div></td>
          <td style="text-align:right;font-variant-numeric:tabular-nums">${num(r.total)}</td>
          <td style="text-align:right;font-variant-numeric:tabular-nums">${num(r.prod)}</td>
          <td style="text-align:right;font-variant-numeric:tabular-nums;${r.apr ? 'color:var(--warn);font-weight:700' : ''}">${num(r.apr)}</td>
          <td style="text-align:right;font-variant-numeric:tabular-nums;color:var(--good);font-weight:800">${num(r.feito)}</td>
          <td style="text-align:right;font-variant-numeric:tabular-nums;${r.atras ? 'color:var(--late);font-weight:700' : ''}">${num(r.atras)}</td>
          <td style="text-align:right;font-variant-numeric:tabular-nums">${num(r.rep)}</td>
          <td><div style="display:flex;align-items:center;gap:8px">
            <div class="medidor" style="flex:1"><i style="width:${Math.min(100, p)}%;background:${p >= 100 ? 'var(--good)' : 'var(--s6)'}"></i></div>
            <span style="font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap">${r.feito}/${r.meta}</span>
          </div></td></tr>`;
      }).join('')}</tbody>
      <tfoot><tr style="font-weight:800;color:var(--azul)">
        <td>TOTAL</td>
        <td style="text-align:right">${num(somaReg('total'))}</td>
        <td style="text-align:right">${num(somaReg('prod'))}</td>
        <td style="text-align:right">${num(somaReg('apr'))}</td>
        <td style="text-align:right">${num(somaReg('feito'))}</td>
        <td style="text-align:right">${num(somaReg('atras'))}</td>
        <td style="text-align:right">${num(somaReg('rep'))}</td>
        <td style="font-size:11.5px">${pct(somaReg('feito'), somaReg('meta'))}% da meta de ${num(somaReg('meta'))}</td>
      </tr></tfoot></table>
    </div></div>

  <div class="grade g3">
    <div class="cartao"><div class="cab"><h2>Squads na frente</h2><span class="nota">concluídas no período</span></div>
      <div class="corpo">${barras(rankSquad.map((r) => ({ n: r.n, v: r.v })))}
        ${(() => {
          const c = rankSquad.filter((r) => r.v);
          if (!c.length) return '';
          const melhor = c.slice().sort((a, b) => b.prazo - a.prazo || b.v - a.v)[0];
          const pior = c.slice().sort((a, b) => a.prazo - b.prazo || a.v - b.v)[0];
          return `<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:12px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap">
            <span>Melhor prazo: <b style="color:var(--good)">${esc(melhor.n)} ${melhor.prazo}%</b></span>
            ${pior.n !== melhor.n ? `<span>Pior prazo: <b style="color:var(--late)">${esc(pior.n)} ${pior.prazo}%</b></span>` : ''}
          </div>`;
        })()}
      </div></div>

    <div class="cartao"><div class="cab"><h2>Quem mais operacionaliza</h2><span class="nota">conteúdos concluídos</span></div>
      <div class="corpo">${rankAnalista.length ? `<div class="lista-pessoas">${rankAnalista.slice(0, 8).map((r, i) => `
          <div class="pessoa-linha">
            <span style="font-weight:800;color:var(--muted);width:16px;text-align:center">${i + 1}</span>
            ${ASSETS.fotos[r.foto] ? `<img src="${ASSETS.fotos[r.foto]}" alt="">` : `<span class="ini" style="width:34px;height:34px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800">${iniciais(r.n)}</span>`}
            <span><b>${esc(r.n)}</b><span>${r.total} em andamento ou feitas</span></span>
            <span class="dir"><span class="tag n">${r.v} concluídas</span></span>
          </div>`).join('')}</div>` : '<div class="vazio">Ninguém com ação no período.</div>'}
      </div></div>

    <div class="cartao"><div class="cab"><h2>Produção por tipo</h2></div>
      <div class="corpo">${barras(porTipo)}</div></div>
  </div>

  <div class="cartao" style="margin-top:14px"><div class="cab"><h2>Mapa da produção</h2><span class="nota">clique numa regional para filtrar</span></div>
    <div class="corpo">${desenhaMapa(vivas)}</div></div>`;
}

/* ---- MAPA ---- */
const areasDaSquad = (q) => (q.mapas && q.mapas.length ? q.mapas : [q.mapa]).filter(Boolean);

function desenhaMapa(lista, alturaMax) {
  const porReg = {};
  DB.get('squads').forEach((q) => {
    const v = lista.filter((a) => a.squadId === q.id).length;
    areasDaSquad(q).forEach((k) => { porReg[k] = { squad: q, v }; });
  });
  const vals = Object.values(porReg).map((o) => o.v);
  const max = Math.max(1, ...vals), min = Math.min(...vals.filter((v) => v > 0).concat([max]));
  const escala = ['#E8ECFB', '#C6D0F7', '#93A6EE', '#5D77E3', '#2E4FD6', '#0027BD'];
  const tom = (v) => {
    if (!v) return 0;
    if (max === min) return 3;
    return Math.min(5, 1 + Math.round(((v - min) / (max - min)) * 4));
  };

  const paths = Object.entries(ASSETS.mapa.regioes).map(([k, d]) => {
    const o = porReg[k] || { v: 0, squad: { nome: k } };
    const i = tom(o.v);
    const sel = S.filtros.squad && S.filtros.squad === (o.squad || {}).id;
    return `<path class="mun ${sel ? 'sel' : ''}" d="${d}" fill="${o.v ? `url(#g${i})` : 'var(--surface-2)'}"
      stroke="${sel ? '#17E3CB' : 'var(--surface)'}" stroke-width="${sel ? 9 : 5}" stroke-linejoin="round"
      data-reg="${esc(k)}" data-squad="${esc((o.squad || {}).id || '')}" data-nome="${esc((o.squad || {}).nome || k)}" data-v="${o.v}"></path>`;
  }).join('');

  const rotulos = Object.entries(ASSETS.mapa.centros || {}).map(([k, c]) => {
    const o = porReg[k] || { v: 0 };
    const claro = tom(o.v) >= 3;
    const sig = (ASSETS.mapa.siglas || {})[k] || k.slice(0, 3).toUpperCase();
    return `<g class="rotulo" text-anchor="middle">
      <text x="${c[0]}" y="${c[1] - 6}" class="qt" fill="${claro ? '#fff' : '#0027BD'}" stroke="${claro ? 'rgba(0,20,90,.35)' : 'rgba(255,255,255,.9)'}">${o.v}</text>
      <text x="${c[0]}" y="${c[1] + 26}" fill="${claro ? 'rgba(255,255,255,.92)' : '#3A4A63'}" stroke="${claro ? 'rgba(0,20,90,.3)' : 'rgba(255,255,255,.9)'}">${esc(sig)}</text>
    </g>`;
  }).join('');

  const defs = `<defs>${escala.map((c, i) => `<linearGradient id="g${i}" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="${i >= 3 ? '#001C86' : escala[Math.min(5, i + 1)]}"/>
    </linearGradient>`).join('')}
    <filter id="sombraMapa" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0A1A66" flood-opacity="0.22"/>
    </filter></defs>`;

  return `<div style="display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start">
    <div class="mapa-wrap" style="flex:0 0 auto;max-width:100%">
      <svg viewBox="${ASSETS.mapa.viewBox}" width="266" height="${alturaMax || 388}" style="max-width:100%;height:auto" role="img" aria-label="Mapa das regionais do Piauí">
        ${defs}<g filter="url(#sombraMapa)">${paths}</g>${rotulos}
      </svg>
      <div class="legenda-mapa">
        <span style="font-size:11px;color:var(--muted);margin-right:7px">${min === max ? 0 : min}</span>
        ${escala.map((c) => `<i style="background:${c}"></i>`).join('')}
        <span style="font-size:11px;color:var(--muted);margin-left:7px">${max} ações</span>
      </div>
    </div>
    <div style="flex:1 1 280px;min-width:250px;display:flex;flex-direction:column;gap:12px">
      <table class="compacta"><thead><tr><th>Regional</th><th style="text-align:right">Ações</th><th style="text-align:right">Concluídas</th><th style="text-align:right">Meta</th></tr></thead>
      <tbody>${DB.get('squads').map((q) => {
        const da = lista.filter((a) => a.squadId === q.id);
        const sel = S.filtros.squad === q.id;
        return `<tr style="cursor:pointer${sel ? ';background:var(--s1)' : ''}" data-act="filtra-squad" data-id="${q.id}">
          <td><b>${esc(q.nome)}</b></td>
          <td style="text-align:right;font-variant-numeric:tabular-nums">${da.length}</td>
          <td style="text-align:right;font-variant-numeric:tabular-nums;color:var(--good);font-weight:800">${da.filter(conta).length}</td>
          <td style="text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)">${q.metaDia}/dia</td>
        </tr>`;
      }).join('')}</tbody>
      <tfoot><tr>
        <td><b style="color:var(--azul)">TOTAL</b></td>
        <td style="text-align:right;font-weight:800;color:var(--azul)">${lista.length}</td>
        <td style="text-align:right;font-weight:800;color:var(--azul)">${lista.filter(conta).length}</td>
        <td style="text-align:right;font-weight:800;color:var(--azul)">${DB.get('squads').reduce((x, q) => x + (Number(q.metaDia) || 0), 0)}/dia</td>
      </tr></tfoot></table>
      ${(() => {
        const ranking = DB.get('squads').map((q) => ({ n: q.nome, v: lista.filter((a) => a.squadId === q.id && conta(a)).length }))
          .sort((a, b) => b.v - a.v);
        const semNada = ranking.filter((r) => !r.v);
        return `<div style="margin-top:auto;display:grid;gap:9px">
          <div style="background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:12px 14px">
            <div style="font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700">Na frente</div>
            <div style="font-size:15px;font-weight:800;margin-top:3px">${ranking[0] && ranking[0].v ? esc(ranking[0].n) + ' · ' + ranking[0].v + ' concluídas' : 'ninguém concluiu ainda'}</div>
          </div>
          <div style="background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:12px 14px">
            <div style="font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700">Sem conteúdo concluído</div>
            <div style="font-size:13px;font-weight:600;margin-top:3px;color:${semNada.length ? 'var(--warn)' : 'var(--good)'}">${semNada.length ? esc(semNada.map((r) => r.n).join(', ')) : 'todas as regionais entregaram'}</div>
          </div>
        </div>`;
      })()}
    </div>
  </div>`;
}

function ligarMapa() {
  $$('path.mun').forEach((p) => {
    p.addEventListener('click', () => {
      const sq = p.dataset.squad;
      if (!sq) return;
      S.filtros.squad = S.filtros.squad === sq ? '' : sq;
      toast(S.filtros.squad ? 'Filtrando por ' + p.dataset.nome : 'Filtro de squad limpo');
      render();
    });
    p.addEventListener('mousemove', (e) => {
      let d = $('.dica'); if (!d) { d = document.createElement('div'); d.className = 'dica'; document.body.appendChild(d); }
      d.innerHTML = `<b>${esc(p.dataset.nome)}</b>${p.dataset.v} ações no período`;
      d.style.left = Math.min(window.innerWidth - 240, e.clientX + 14) + 'px'; d.style.top = (e.clientY + 14) + 'px';
    });
    p.addEventListener('mouseleave', () => { const d = $('.dica'); if (d) d.remove(); });
  });
}
function telaMapa() {
  const A = periodo(minhasAcoes(DB.get('acoes'))).filter(ativa);
  const munsPorReg = {};
  ASSETS.municipios.forEach((m) => { (munsPorReg[m.r] = munsPorReg[m.r] || []).push(m.n); });
  return `${barraFiltros(['de', 'ate', 'tipo', 'status'])}
  <div class="cartao"><div class="cab"><h2>Produção por regional</h2><span class="nota">divisão oficial da base Divisao_PI, 225 municípios</span></div>
    <div class="corpo">${desenhaMapa(A, 470)}</div></div>
  <div class="grade g3" style="margin-top:14px">
    ${DB.get('squads').map((q) => {
      const ms = munsPorReg[q.mapa] || [];
      const da = A.filter((a) => a.squadId === q.id);
      const c = da.filter(conta).length;
      const meta = (Number(q.metaDia) || 0) * Math.max(1, difDias(S.filtros.de, S.filtros.ate) + 1);
      return `<div class="cartao"><div class="cab"><h2>${esc(q.nome)}</h2><span class="nota">${ms.length ? ms.length + ' municípios' : q.tipo}</span></div>
        <div class="corpo">
          <div style="display:flex;gap:16px;margin-bottom:10px">
            <div><div style="font-size:22px;font-weight:800">${da.length}</div><div style="font-size:11px;color:var(--muted)">ações</div></div>
            <div><div style="font-size:22px;font-weight:800;color:var(--good)">${c}</div><div style="font-size:11px;color:var(--muted)">concluídas</div></div>
            <div><div style="font-size:22px;font-weight:800;color:${da.filter(estaAtrasada).length ? 'var(--late)' : 'var(--muted)'}">${da.filter(estaAtrasada).length}</div><div style="font-size:11px;color:var(--muted)">atrasadas</div></div>
          </div>
          <div class="medidor" title="${c} de ${meta} na meta do período"><i style="width:${Math.min(100, pct(c, meta))}%;background:${c >= meta ? 'var(--good)' : 'var(--s6)'}"></i></div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:5px">${pct(c, meta)}% da meta do período (${meta} conteúdos)</div>
          ${ms.length ? `<details style="margin-top:9px"><summary style="cursor:pointer;font-size:12.5px;color:var(--azul);font-weight:600">ver municípios</summary>
            <div style="font-size:12px;color:var(--ink-2);margin-top:8px;line-height:1.6">${ms.map(esc).join(' · ')}</div></details>` : ''}
        </div></div>`;
    }).join('')}
  </div>`;
}

function ficha(a) {
  const s = saudeDe(a), an = porId('analistas', a.analistaId), t = porId('tipos', a.tipoId);
  const total = Math.max(1, difDias(a.criadoEm, a.prazo || a.criadoEm));
  const corrido = Math.max(0, Math.min(total, difDias(a.criadoEm, hoje())));
  const p = Math.round((corrido / total) * 100);
  return `<article class="ficha" draggable="true" data-id="${a.id}">
    <h4 data-act="abrir-acao" data-id="${a.id}" style="cursor:pointer">${esc(a.titulo)}</h4>
    <div class="meta">
      <span class="tag n">${esc((t || {}).nome || 'sem tipo')}</span>
      <span class="tag ${s.c === 'st' ? 'n' : s.c}">${esc(s.t)}</span>
      ${a.status === 'concluido' ? `<span class="selo">✓ liberada${a.aprovadoPor ? ' por ' + esc(a.aprovadoPor) : ''}</span>` : ''}
      ${(() => { const k = checklistDe(a); return k.ok
        ? '<span class="selo">✓ completa</span>'
        : `<span class="selo pend" title="falta preencher">falta ${esc(k.falta.join(', '))}</span>`; })()}
      ${a.municipio ? `<span>${esc(a.municipio)}</span>` : ''}
      ${urlSegura(a.linkDrive) ? '<span title="tem link no drive">🔗</span>' : ''}
    </div>
    <div class="pes">
      ${an && ASSETS.fotos[an.foto] ? `<img src="${ASSETS.fotos[an.foto]}" alt="">` : ''}
      <span>${esc(an ? an.nome.split(' ').slice(0, 2).join(' ') : 'sem responsável')}</span>
      <span style="margin-left:auto;color:var(--muted);font-size:10.5px">${a.prazo ? 'prazo ' + fmtData(a.prazo) : ''}</span>
    </div>
    ${a.status === 'aprovacao' && pode('aprovar') ? `<div style="display:flex;gap:6px;margin-top:9px">
      <button class="btn mini" style="flex:1" data-act="aprovar" data-id="${a.id}">Liberar</button>
      <button class="btn ghost mini" data-act="reprovar" data-id="${a.id}">Devolver</button></div>` : ''}
    ${a.status === 'standby' ? '' : `<div class="barrinha"><i style="width:${Math.min(100, p)}%;background:${s.c === 'no' ? 'var(--late)' : s.c === 'at' ? 'var(--warn)' : 'var(--s4)'}"></i></div>`}
  </article>`;
}

function ligarArrasto() {
  let arrastando = null;
  $$('.ficha').forEach((f) => {
    f.addEventListener('dragstart', (e) => { arrastando = f.dataset.id; f.classList.add('arrastando'); e.dataTransfer.effectAllowed = 'move'; });
    f.addEventListener('dragend', () => { f.classList.remove('arrastando'); arrastando = null; $$('.col').forEach((c) => c.classList.remove('alvo')); });
  });
  $$('[data-drop]').forEach((z) => {
    z.addEventListener('dragover', (e) => { e.preventDefault(); z.closest('.col').classList.add('alvo'); });
    z.addEventListener('dragleave', () => z.closest('.col').classList.remove('alvo'));
    z.addEventListener('drop', (e) => {
      e.preventDefault(); z.closest('.col').classList.remove('alvo');
      if (arrastando) mudarStatus(arrastando, z.dataset.drop);
    });
  });
}

function mudarStatus(id, novo) {
  const a = porId('acoes', id); if (!a || a.status === novo) return;
  if (novo === 'concluido' && !pode('aprovar')) {
    a.status = 'aprovacao'; a.producaoEm = a.producaoEm || hoje();
    DB.upd('acoes', a);
    registrar(`"${a.titulo}" foi para Em aprovação`);
    toast('Quem conclui é a coordenação. A ação entrou na fila de aprovação.');
    return render();
  }
  const antigo = a.status;
  a.status = novo;
  if (novo !== 'criacao' && !a.producaoEm) a.producaoEm = hoje();
  if (novo === 'concluido') {
    a.concluidoEm = a.concluidoEm || hoje();
    a.aprovado = true; a.aprovadoPor = a.aprovadoPor || S.user.login; a.aprovadoEm = a.aprovadoEm || hoje();
  } else {
    a.concluidoEm = ''; a.aprovado = false; a.aprovadoPor = ''; a.aprovadoEm = '';
  }
  if (novo === 'criacao') a.producaoEm = '';
  DB.upd('acoes', a);
  registrar(`"${a.titulo}": ${(STATUS.find((s) => s.id === antigo) || {}).nome} → ${(STATUS.find((s) => s.id === novo) || {}).nome}`);
  toast(novo === 'concluido'
    ? 'Liberada pela coordenação. Já conta na meta.'
    : 'Movida para ' + (STATUS.find((s) => s.id === novo) || {}).nome);
  render();
}

function aprovar(id) {
  const a = porId('acoes', id); if (!a) return;
  a.status = 'concluido';
  a.concluidoEm = a.concluidoEm || hoje();
  a.aprovado = true; a.aprovadoPor = S.user.login; a.aprovadoEm = hoje(); a.motivo = '';
  DB.upd('acoes', a);
  registrar(`Aprovou "${a.titulo}"`);
  toast('Liberada. Já conta na meta.'); render();
}
function reprovar(id) {
  const a = porId('acoes', id); if (!a) return;
  modal('Devolver para produção', `<p style="margin-top:0;color:var(--muted);font-size:13px">Diga o que precisa ser ajustado. O responsável vê isso na ação.</p>
    ${campo({ k: 'motivo', l: 'Motivo', t: 'textarea', ph: 'ex.: trocar a trilha e cortar os 10 segundos finais' }, a.motivo)}`,
    [{ t: 'Cancelar', cls: 'ghost', fn: fecharModal }, {
      t: 'Devolver', cls: 'perigo', fn: (f) => {
        const d = lerFormulario(f);
        a.status = 'producao'; a.aprovado = false; a.aprovadoPor = ''; a.aprovadoEm = '';
        a.concluidoEm = ''; a.motivo = d.motivo;
        DB.upd('acoes', a); registrar(`Devolveu "${a.titulo}" para produção`);
        fecharModal(); toast('Devolvida para produção'); render();
      }
    }]);
}

/* ---- REPERCUSSÃO ---- */
function minhasReps(lista) {
  const u = S.user || {};
  if (pode('gerencial')) return lista;
  const sq = squadsDoUsuario(u);
  return sq.length ? lista.filter((r) => sq.includes(r.squadId)) : lista;
}
function periodoRep(lista) {
  const f = S.filtros;
  return lista.filter((r) => (!f.de || r.data >= f.de) && (!f.ate || r.data <= f.ate)
    && (!f.squad || r.squadId === f.squad)
    && (!f.busca || (r.titulo || '').toLowerCase().includes(f.busca.toLowerCase())));
}

function valoresUsados(campo, extras) {

/* ---- FORMULÁRIO DE AÇÃO ---- */
function formAcao(id) {
  const nova = !id;
  const idFixo = id || uid();
  const a = nova ? {
    id: '', titulo: '', squadId: (S.user.squadId || ''), analistaId: (S.user.analistaId || ''), tipoId: '',
    frente: '', comQuem: '', marcaId: '', canais: [], municipio: '', status: 'criacao',
    criadoEm: hoje(), prazo: '', producaoEm: '', concluidoEm: '', aprovado: false, aprovadoPor: '', aprovadoEm: '',
    motivo: '', linkDrive: '', obs: ''
  } : Object.assign({}, porId('acoes', id));

  const munOpts = ASSETS.municipios.map((m) => `<option value="${esc(m.n)}">`).join('');

  const html = `
    ${campo({ k: 'titulo', l: 'Título da ação', req: true, ph: 'Card de aviso de manutenção' }, a.titulo)}
    <div class="dupla">
      ${campo({ k: 'frente', l: 'Frente', list: 'lista-frentes', ph: 'Mutirão Tarifa Social' }, a.frente)}
      ${campo({ k: 'comQuem', l: 'Está com quem', list: 'lista-comquem', ph: 'quem está tocando' }, a.comQuem)}
    </div>
    <datalist id="lista-frentes">${frentesConhecidas().map((f) => `<option value="${esc(f)}">`).join('')}</datalist>
    <datalist id="lista-comquem">${comQuemConhecidos().map((f) => `<option value="${esc(f)}">`).join('')}</datalist>
    <div class="dupla">
      ${campo({ k: 'squadId', l: 'Squad', t: 'select', req: true, opcoes: opcoes('squads') }, a.squadId)}
      ${campo({ k: 'analistaId', l: 'Responsável', t: 'select', opcoes: opcoes('analistas') }, a.analistaId)}
    </div>
    <div class="dupla">
      ${campo({ k: 'tipoId', l: 'Tipo de conteúdo', t: 'select', req: true, opcoes: opcoes('tipos') }, a.tipoId)}
      ${campo({ k: 'marcaId', l: 'Marca', t: 'select', opcoes: opcoes('marcas') }, a.marcaId)}
    </div>
    <div class="dupla">
      ${campo({ k: 'municipio', l: 'Município', list: 'lista-municipios', ph: 'Picos' }, a.municipio)}
      ${campo({ k: 'status', l: 'Status', t: 'select', vazio: false, opcoes: STATUS.map((s) => ({ v: s.id, t: s.nome })) }, a.status)}
    </div>
    <datalist id="lista-municipios">${munOpts}</datalist>
    <div class="campo"><label>Canais</label>
      <div class="checks" data-k="canais" data-multi="1">
        ${DB.get('canais').map((c) => `<label><input type="checkbox" value="${c.id}" ${(a.canais || []).includes(c.id) ? 'checked' : ''}>${esc(c.nome)}</label>`).join('')}
      </div>
      <button type="button" class="btn ghost mini" style="margin-top:8px" data-act="novo-canal-inline">+ cadastrar canal agora</button>
    </div>
    ${campo({ k: 'linkDrive', l: 'Link do material', t: 'url', ph: 'https://...', nota: 'vídeo entra aqui, pelo link do SharePoint' }, a.linkDrive)}
    ${campo({ k: 'obs', l: 'Observações', t: 'textarea' }, a.obs)}
    <div class="campo"><label>Material anexado</label>
      <div data-galeria-acao></div>
      <button type="button" class="btn ghost mini" style="margin-top:8px" data-anexar-acao>+ Anexar JPEG, PNG ou PDF</button>
      <div class="nota" style="font-size:11.5px;color:var(--muted);margin-top:5px">até ${ANEXO_MB} MB por arquivo; vídeo vai pelo link acima. É isso que a coordenação vê na hora de liberar.</div>
    </div>
    <details class="mais"${nova ? '' : ' open'}><summary>Datas</summary>
      <div class="dupla">
        ${campo({ k: 'criadoEm', l: 'Criada em', t: 'date' }, a.criadoEm)}
        ${campo({ k: 'concluidoEm', l: 'Concluída em', t: 'date' }, a.concluidoEm)}
      </div>
      ${campo({ k: 'prazo', l: 'Prazo', t: 'date', nota: 'opcional; em branco, a ação não fica atrasada' }, a.prazo)}
    </details>
    ${a.motivo ? `<div style="background:var(--late-bg);color:var(--late);border-radius:8px;padding:10px 12px;font-size:12.5px;font-weight:600">Devolvida pela coordenação: ${esc(a.motivo)}</div>` : ''}
    ${!nova ? (() => { const k = checklistDe(a); return `<div style="margin-top:12px;padding:11px 13px;border-radius:9px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:${k.ok ? 'var(--good-bg)' : 'var(--warn-bg)'}">
      <b style="color:${k.ok ? 'var(--good)' : 'var(--warn)'};font-size:12.5px">${k.ok ? '✓ Checklist completo' : 'Falta preencher'}</b>
      ${k.ok ? '' : `<span style="font-size:12.5px;color:var(--ink-2)">${esc(k.falta.join(', '))}</span>`}
    </div>`; })() : ''}
    ${!nova && a.status === 'concluido' ? `<div style="margin-top:12px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span class="selo">✓ liberada</span>
      <span style="font-size:12.5px;color:var(--muted)">${a.aprovadoPor ? `por ${esc(a.aprovadoPor)} em ${fmtData(a.aprovadoEm)}` : 'conta na meta'}</span>
    </div>` : ''}
  `;

  const janela = modal(nova ? 'Nova ação' : 'Editar ação', html, [
    ...(nova ? [] : [{ t: 'Excluir', cls: 'perigo', fn: () => { if (confirm('Excluir esta ação?')) { DB.del('acoes', id); registrar('Ação excluída'); fecharModal(); toast('Ação excluída'); render(); } } }]),
    { t: 'Cancelar', cls: 'ghost', fn: fecharModal },
    {
      t: nova ? 'Cadastrar' : 'Salvar', fn: (f) => {
        const o = lerFormulario(f);
        if (!o.titulo) { toast('Dá um título para a ação.'); return; }
        if (!o.squadId) { toast('Escolhe a squad.'); return; }
        if (!o.tipoId) { toast('Escolhe o tipo de conteúdo.'); return; }
        o.criadoEm = o.criadoEm || hoje();
        if (o.status !== 'criacao' && !o.producaoEm) o.producaoEm = hoje();
        if (o.status === 'concluido' && !o.concluidoEm) o.concluidoEm = hoje();
        if (o.status === 'concluido' && !pode('aprovar')) { toast('Quem conclui é a coordenação. Deixei em Em aprovação.'); o.status = 'aprovacao'; }
        if (o.status !== 'concluido') { o.concluidoEm = ''; o.aprovado = false; o.aprovadoPor = ''; o.aprovadoEm = ''; }
        else { o.aprovado = true; o.aprovadoPor = a.aprovadoPor || S.user.login; o.aprovadoEm = a.aprovadoEm || hoje(); }
        o.motivo = a.motivo || '';
        if (nova) { o.id = idFixo; o.criadoPor = S.user.login; DB.add('acoes', o); registrar(`Ação "${o.titulo}" cadastrada`); }
        else { o.id = id; DB.upd('acoes', o); registrar(`Ação "${o.titulo}" editada`); }
        fecharModal(); toast(nova ? 'Ação cadastrada' : 'Ação salva'); render();
      }
    }
  ]);

  {
    const gal = $('[data-galeria-acao]', janela);
    pintarAnexos(gal, idFixo, true);
    $('[data-anexar-acao]', janela).addEventListener('click', () => botaoAnexar(idFixo, () => pintarAnexos(gal, idFixo, true)));
  }
  $('[data-act="novo-canal-inline"]', janela).addEventListener('click', () => {
    const n = prompt('Nome do canal:'); if (!n) return;
    const c = DB.add('canais', { nome: n.trim(), grupo: 'Outro' });
    const box = $('[data-k="canais"]', janela);
    const l = document.createElement('label');
    l.innerHTML = `<input type="checkbox" value="${c.id}" checked>${esc(c.nome)}`;
    box.appendChild(l); toast('Canal cadastrado');
  });

}
